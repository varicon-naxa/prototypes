<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Edit Supplier — Payment Terms</title>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  /* Inlined from tokens.css — Varicon design tokens */
  @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap');

  :root {
    --primary-main:          #143666;
    --primary-light:         #597696;
    --primary-dark:          #0C2043;
    --primary-contrast:      #FFFFFF;
    --primary-background:    rgba(20, 54, 102, 0.08);
    --primary-border:        rgba(20, 54, 102, 0.50);
    --secondary-main:        #F19100;
    --secondary-light:       #FBC064;
    --secondary-dark:        #C17400;
    --secondary-contrast:    #143666;
    --secondary-background:  rgba(241, 145, 0, 0.08);
    --text-primary:          rgba(0, 5, 10, 0.87);
    --text-secondary:        rgba(0, 5, 10, 0.64);
    --text-disabled:         rgba(0, 5, 10, 0.38);
    --text-hint:             rgba(0, 5, 10, 0.38);
    --text-on-primary:       #FFFFFF;
    --bg-default:            #F2F7FD;
    --bg-paper:              #FFFFFF;
    --success-main:          #0F8A0F;
    --success-text:          #063D06;
    --success-bg:            #DBF0DC;
    --error-main:            #D2281B;
    --error-text:            #54100B;
    --error-bg:              #FAE9E8;
    --warning-main:          #FF9800;
    --warning-text:          #663D00;
    --warning-bg:            #FFF5E5;
    --info-main:             #0075E0;
    --info-text:             #002F5A;
    --info-bg:               #E5F1FC;
    --grey-50:               #FAFAFA;
    --grey-100:              #F5F5F5;
    --grey-200:              #EEEEEE;
    --grey-300:              #E0E0E0;
    --grey-400:              #BDBDBD;
    --grey-500:              #9E9E9E;
    --grey-600:              #757575;
    --grey-700:              #616161;
    --grey-800:              #424242;
    --grey-900:              #212121;
    --divider:               rgba(0, 0, 0, 0.12);
    --divider-solid:         #E0E0E0;
    --border:                rgba(0, 0, 0, 0.23);
    --border-solid:          #C4C4C4;
    --border-light:          rgba(255, 255, 255, 0.23);
    --color-bg:              var(--bg-default);
    --color-surface:         var(--bg-paper);
    --color-fg:              var(--text-primary);
    --color-fg-muted:        var(--text-secondary);
    --color-fg-disabled:     var(--text-disabled);
    --color-accent:          var(--secondary-main);
    --color-brand:           var(--primary-main);
    --font-sans:             'Roboto', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    --font-mono:             'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --fw-regular:            400;
    --fw-medium:             500;
    --fw-bold:               700;
    --fs-h1:                 96px;   --lh-h1: 112px;  --ls-h1: -1.5px;
    --fs-h2:                 60px;   --lh-h2: 72px;   --ls-h2: -0.5px;
    --fs-h3:                 48px;   --lh-h3: 56px;   --ls-h3: 0;
    --fs-h4:                 34px;   --lh-h4: 42px;   --ls-h4: 0.25px;
    --fs-h5:                 24px;   --lh-h5: 32px;   --ls-h5: 0;
    --fs-h6:                 20px;   --lh-h6: 28px;   --ls-h6: 0.15px;
    --fs-subtitle1:          16px;   --lh-subtitle1: 24px;  --ls-subtitle1: 0.15px;
    --fs-subtitle2:          14px;   --lh-subtitle2: 22px;  --ls-subtitle2: 0.1px;
    --fs-body1:              16px;   --lh-body1: 24px;      --ls-body1: 0.15px;
    --fs-body2:              14px;   --lh-body2: 20px;      --ls-body2: 0.17px;
    --fs-button:             14px;   --lh-button: 24px;     --ls-button: 0.25px;
    --fs-caption:            12px;   --lh-caption: 16px;    --ls-caption: 0.4px;
    --fs-overline:           12px;   --lh-overline: 16px;   --ls-overline: 1px;
    --space-05:              2px;
    --space-1:               4px;
    --space-2:               8px;
    --space-3:               12px;
    --space-4:               16px;
    --space-5:               20px;
    --space-6:               24px;
    --space-7:               28px;
    --space-8:               32px;
    --space-9:               36px;
    --space-10:              40px;
    --space-11:              44px;
    --space-12:              48px;
    --radius-xs:             2px;
    --radius-sm:             4px;
    --radius-md:             8px;
    --radius-lg:             12px;
    --radius-pill:           999px;
    --shadow-1:  0 1px 3px  rgba(0,0,0,0.12), 0 1px 2px  rgba(0,0,0,0.24);
    --shadow-2:  0 3px 6px  rgba(0,0,0,0.12), 0 2px 4px  rgba(0,0,0,0.10);
    --shadow-4:  0 10px 20px rgba(0,0,0,0.10), 0 3px 6px  rgba(0,0,0,0.08);
    --shadow-8:  0 15px 25px rgba(0,0,0,0.12), 0 5px 10px rgba(0,0,0,0.06);
    --shadow-focus-primary:  0 0 0 3px rgba(20, 54, 102, 0.25);
    --shadow-focus-secondary:0 0 0 3px rgba(241, 145, 0, 0.35);
    --ease-standard:         cubic-bezier(0.4, 0.0, 0.2, 1);
    --ease-decelerate:       cubic-bezier(0.0, 0.0, 0.2, 1);
    --ease-accelerate:       cubic-bezier(0.4, 0.0, 1, 1);
    --dur-fast:              120ms;
    --dur-base:              200ms;
    --dur-slow:              300ms;
  }

  html, body {
    font-family: var(--font-sans);
    font-size: var(--fs-body1);
    line-height: var(--lh-body1);
    letter-spacing: var(--ls-body1);
    color: var(--text-primary);
    background: var(--bg-default);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }

  h1, .h1 { font: var(--fw-bold) var(--fs-h1)/var(--lh-h1) var(--font-sans); letter-spacing: var(--ls-h1); margin: 0; }
  h2, .h2 { font: var(--fw-bold) var(--fs-h2)/var(--lh-h2) var(--font-sans); letter-spacing: var(--ls-h2); margin: 0; }
  h3, .h3 { font: var(--fw-bold) var(--fs-h3)/var(--lh-h3) var(--font-sans); letter-spacing: var(--ls-h3); margin: 0; }
  h4, .h4 { font: var(--fw-bold) var(--fs-h4)/var(--lh-h4) var(--font-sans); letter-spacing: var(--ls-h4); margin: 0; }
  h5, .h5 { font: var(--fw-medium) var(--fs-h5)/var(--lh-h5) var(--font-sans); letter-spacing: var(--ls-h5); margin: 0; }
  h6, .h6 { font: var(--fw-medium) var(--fs-h6)/var(--lh-h6) var(--font-sans); letter-spacing: var(--ls-h6); margin: 0; }

  .subtitle1 { font: var(--fw-medium) var(--fs-subtitle1)/var(--lh-subtitle1) var(--font-sans); letter-spacing: var(--ls-subtitle1); }
  .subtitle2 { font: var(--fw-medium) var(--fs-subtitle2)/var(--lh-subtitle2) var(--font-sans); letter-spacing: var(--ls-subtitle2); }

  p, .body1 { font: var(--fw-regular) var(--fs-body1)/var(--lh-body1) var(--font-sans); letter-spacing: var(--ls-body1); margin: 0; }
  .body2    { font: var(--fw-regular) var(--fs-body2)/var(--lh-body2) var(--font-sans); letter-spacing: var(--ls-body2); }

  .caption  { font: var(--fw-regular) var(--fs-caption)/var(--lh-caption) var(--font-sans); letter-spacing: var(--ls-caption); color: var(--text-secondary); }
  .overline { font: var(--fw-medium) var(--fs-overline)/var(--lh-overline) var(--font-sans); letter-spacing: var(--ls-overline); text-transform: uppercase; }

  .button-text {
    font: var(--fw-medium) var(--fs-button)/var(--lh-button) var(--font-sans);
    letter-spacing: var(--ls-button);
    text-transform: uppercase;
  }

  code, kbd, pre, samp {
    font-family: var(--font-mono);
    font-size: 0.9375em;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg-default);
    font-family: var(--font-sans);
    color: var(--text-primary);
    overflow: hidden;
  }

  /* ---------- Prototype state toggle (outside the panel) ---------- */
  .proto-toggle-bar {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 12px;
    background: #FFFFFF;
    border: 1px solid var(--divider-solid);
    border-radius: 999px;
    padding: 6px 8px 6px 16px;
    box-shadow: var(--shadow-2);
    font-family: var(--font-sans);
  }
  .proto-toggle-bar .label {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-secondary);
    letter-spacing: 0.2px;
  }
  .proto-toggle-bar .seg {
    display: inline-flex;
    background: var(--grey-100);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
  }
  .proto-toggle-bar .seg button {
    appearance: none;
    border: 0;
    background: transparent;
    padding: 6px 14px;
    border-radius: 999px;
    font-family: var(--font-sans);
    font-size: 12px;
    font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background var(--dur-fast) var(--ease-standard), color var(--dur-fast) var(--ease-standard);
  }
  .proto-toggle-bar .seg button .dot {
    width: 6px; height: 6px; border-radius: 999px;
    background: currentColor;
    opacity: 0.4;
  }
  .proto-toggle-bar .seg button.is-active {
    background: var(--bg-paper);
    color: var(--primary-main);
    box-shadow: 0 1px 2px rgba(0,0,0,0.12);
  }
  .proto-toggle-bar .seg button.is-active .dot {
    opacity: 1;
  }
  .proto-toggle-bar .seg button[data-state="b"].is-active {
    color: #BA7517;
  }
  .proto-tag {
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--secondary-dark);
    background: var(--secondary-background);
    padding: 3px 6px;
    border-radius: 3px;
  }

  /* ---------- Backdrop / suppliers list (dimmed) ---------- */
  .app-shell {
    position: fixed;
    inset: 0;
    display: flex;
  }
  .sidebar {
    width: 200px;
    background: var(--primary-main);
    color: var(--text-on-primary);
    padding: 20px 0;
    flex-shrink: 0;
    display: flex; flex-direction: column;
  }
  .sidebar .brand {
    padding: 0 20px 20px;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: 0.15px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .sidebar .org {
    margin: 12px 12px 16px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.10);
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .sidebar .org .av {
    width: 22px; height: 22px; border-radius: 999px;
    background: var(--secondary-main);
    color: var(--primary-main);
    font-weight: 700;
    font-size: 11px;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .sidebar .nav {
    display: flex; flex-direction: column; gap: 1px;
    margin-top: 4px;
  }
  .sidebar .nav a {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 16px;
    font-size: 13px;
    color: rgba(255,255,255,0.85);
    text-decoration: none;
  }
  .sidebar .nav a.active {
    background: var(--secondary-main);
    color: var(--primary-main);
    font-weight: 500;
  }
  .sidebar .nav a svg { width: 16px; height: 16px; flex: 0 0 16px; }

  .main {
    flex: 1;
    background: var(--bg-paper);
    display: flex; flex-direction: column;
    min-width: 0;
  }
  .main-header {
    height: 56px;
    border-bottom: 1px solid var(--divider-solid);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px;
    flex-shrink: 0;
  }
  .main-header .title {
    font-size: 16px;
    font-weight: 500;
    color: var(--text-primary);
  }
  .main-header .actions {
    display: flex; gap: 8px; align-items: center;
  }
  .header-btn {
    height: 32px;
    padding: 0 12px;
    border-radius: 4px;
    border: 1px solid var(--border-solid);
    background: #FFFFFF;
    font-family: var(--font-sans);
    font-size: 12px;
    font-weight: 500;
    color: var(--text-primary);
    display: inline-flex; align-items: center; gap: 6px;
    cursor: pointer;
  }
  .header-btn.search { color: var(--info-main); border-color: #B5D4F4; background: #F4F9FE; }
  .header-btn.primary {
    background: var(--secondary-main); color: var(--primary-main);
    border-color: var(--secondary-main); font-weight: 500;
  }

  .toolbar {
    height: 52px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 24px;
    border-bottom: 1px solid var(--divider-solid);
    flex-shrink: 0;
  }
  .toolbar .left, .toolbar .right { display: flex; align-items: center; gap: 8px; }
  .search-input {
    height: 32px;
    width: 240px;
    border: 1px solid var(--border-solid);
    border-radius: 4px;
    padding: 0 10px;
    font-family: var(--font-sans);
    font-size: 13px;
    background: #FFFFFF;
  }

  .table-wrap { flex: 1; overflow: hidden; padding: 0 24px; }
  table.suppliers {
    width: 100%; border-collapse: collapse; table-layout: fixed;
    font-size: 13px;
  }
  table.suppliers thead th {
    text-align: left;
    font-weight: 500;
    color: var(--text-primary);
    padding: 10px 12px;
    background: #FAFAFA;
    border-bottom: 1px solid var(--divider-solid);
    font-size: 12px;
  }
  table.suppliers tbody td {
    padding: 12px;
    border-bottom: 1px solid var(--divider-solid);
    color: var(--text-primary);
    font-size: 13px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  table.suppliers tbody tr:first-child td { font-weight: 500; }

  /* dim overlay over the entire app while panel is open */
  .scrim {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 50;
  }

  /* ---------- Slide-over panel ---------- */
  .panel {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: 480px;
    background: var(--bg-paper);
    z-index: 60;
    display: flex; flex-direction: column;
    box-shadow: -8px 0 24px rgba(0,0,0,0.10);
  }
  .panel-header {
    height: 56px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px;
    border-bottom: 1px solid var(--divider-solid);
  }
  .panel-header h2 {
    margin: 0;
    font-family: var(--font-sans);
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.15px;
    color: var(--text-primary);
  }
  .panel-header .close {
    width: 28px; height: 28px;
    border-radius: 4px;
    background: transparent;
    border: 0;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer;
    color: var(--text-secondary);
  }
  .panel-header .close:hover { background: var(--grey-100); }

  .panel-body {
    flex: 1; min-height: 0;
    overflow-y: auto;
    padding: 16px 20px 24px;
    display: flex; flex-direction: column;
    gap: 12px;
  }

  /* MUI-style outlined text fields */
  .field { position: relative; }
  .field > input,
  .field > .select-shell {
    width: 100%;
    height: 40px;
    border: 1px solid var(--border-solid);
    border-radius: 4px;
    background: #FFFFFF;
    padding: 14px 12px 0;
    font-family: var(--font-sans);
    font-size: 14px;
    color: var(--text-primary);
    outline: none;
  }
  .field > .select-shell {
    display: flex; align-items: center; justify-content: space-between;
    padding-right: 10px;
    color: var(--text-secondary);
    font-size: 13px;
  }
  .field > input:focus { border-color: var(--primary-main); border-width: 1.5px; padding: 13.5px 11.5px 0 11.5px; }
  .field > input:disabled, .field.disabled > input { background: var(--grey-100); color: var(--text-secondary); cursor: not-allowed; }
  .field > label {
    position: absolute;
    left: 10px; top: 50%; transform: translateY(-50%);
    background: transparent;
    padding: 0 4px;
    font-size: 14px;
    color: var(--text-secondary);
    pointer-events: none;
    transition: all var(--dur-fast) var(--ease-standard);
  }
  .field.is-filled > label,
  .field > input:focus + label,
  .field.has-value > label,
  .field.always-up > label {
    top: 0;
    transform: translateY(-50%);
    font-size: 11px;
    background: #FFFFFF;
    color: var(--text-secondary);
  }
  .field.is-filled > input:focus + label { color: var(--primary-main); }

  .helper-link {
    font-size: 12px;
    color: var(--info-main);
    margin-top: -4px;
    margin-left: 2px;
  }
  .helper-link a { color: var(--info-main); text-decoration: underline; }

  /* phone with flag prefix */
  .field.phone > input { padding-left: 56px; }
  .field.phone .flag {
    position: absolute;
    left: 8px; top: 50%; transform: translateY(-50%);
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 13px;
    color: var(--text-secondary);
  }
  .field.phone .flag .au {
    width: 22px; height: 14px; border-radius: 2px; overflow: hidden;
    background:
      linear-gradient(180deg,#012169 50%, #012169 50%);
    position: relative;
    display: inline-block;
  }
  .field.phone .flag .au::before {
    content: ""; position: absolute; inset: 0;
    background:
      linear-gradient(45deg, transparent 45%, #fff 45%, #fff 55%, transparent 55%),
      linear-gradient(-45deg, transparent 45%, #fff 45%, #fff 55%, transparent 55%);
    opacity: 0.7;
  }

  /* checkbox row */
  .check-row {
    display: flex; align-items: center; gap: 10px;
    font-size: 13px;
    color: var(--text-primary);
    padding: 4px 0;
  }
  .check-row input[type="checkbox"] {
    width: 16px; height: 16px; margin: 0;
    accent-color: var(--primary-main);
  }
  .check-row .info {
    color: var(--text-secondary);
    display: inline-flex;
  }
  .check-row .info svg { width: 14px; height: 14px; }

  /* section divider */
  .section-label {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
    margin-top: 8px;
    margin-bottom: 4px;
  }

  .row-2 {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
  }

  /* dotted "add contact person" link button */
  .add-contact {
    display: inline-flex; align-items: center; gap: 6px;
    align-self: flex-start;
    background: transparent;
    border: 1px dashed var(--border-solid);
    border-radius: 4px;
    padding: 8px 14px;
    color: var(--info-main);
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }
  .add-contact svg { width: 14px; height: 14px; }

  .panel-footer {
    flex-shrink: 0;
    border-top: 1px solid var(--divider-solid);
    padding: 12px 20px;
    display: flex; justify-content: flex-end; gap: 8px;
    background: #FFFFFF;
  }
  .btn {
    height: 36px;
    padding: 0 16px;
    border-radius: 4px;
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.25px;
    text-transform: uppercase;
    cursor: pointer;
    border: 1px solid transparent;
  }
  .btn.ghost {
    background: #FFFFFF;
    border-color: var(--border-solid);
    color: var(--text-primary);
  }
  .btn.primary-teal {
    background: #FBC064;
    color: var(--text-disabled);
    cursor: not-allowed;
  }

  /* ============================================================
     PAYMENT TERMS — the new field
     ============================================================ */
  .pt-block { display: flex; flex-direction: column; gap: 4px; }
  .pt-label-row {
    display: flex; align-items: center; gap: 4px;
    font-family: var(--font-sans);
    font-size: 11px;
    color: var(--text-secondary);
    letter-spacing: 0.15px;
    margin-left: 2px;
  }
  .pt-badge {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: #FFFFFF;
    padding: 2px 5px;
    border-radius: 3px;
    line-height: 1.2;
  }
  .pt-badge.synced { background: #185FA5; }
  .pt-badge.no-terms { background: #888780; }

  .pt-container {
    position: relative;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    padding: 8px 10px 8px 13px; /* extra left for accent bar */
    border-radius: 8px;
    overflow: hidden;
    transition: background var(--dur-base) var(--ease-standard), border-color var(--dur-base) var(--ease-standard);
  }
  .pt-container::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    transition: background var(--dur-base) var(--ease-standard);
  }
  .pt-container.synced {
    border: 0.5px solid #185FA5;
    background: #E6F1FB;
  }
  .pt-container.synced::before { background: #185FA5; }
  .pt-container.no-terms {
    border: 0.5px solid #FAC775;
    background: #FAEEDA;
  }
  .pt-container.no-terms::before { background: #BA7517; }

  .pt-left { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .pt-line1 {
    font-size: 12px;
    font-weight: 500;
    line-height: 16px;
  }
  .pt-line2 {
    font-size: 10px;
    font-weight: 400;
    line-height: 14px;
  }
  .pt-container.synced .pt-line1 { color: #185FA5; }
  .pt-container.synced .pt-line2 { color: #378ADD; }
  .pt-container.no-terms .pt-line1 { color: #BA7517; }
  .pt-container.no-terms .pt-line2 { color: #BA7517; }

  .pt-pill {
    flex-shrink: 0;
    background: #FFFFFF;
    border: 0.5px solid #B5D4F4;
    border-radius: 4px;
    padding: 2px 6px;
    font-size: 10px;
    line-height: 14px;
    color: #378ADD;
    white-space: nowrap;
  }

  .pt-helper {
    font-size: 10px;
    line-height: 14px;
    color: var(--text-disabled);
    margin-top: 4px;
    margin-left: 2px;
  }

  /* scrollbar polish */
  .panel-body::-webkit-scrollbar { width: 8px; }
  .panel-body::-webkit-scrollbar-thumb { background: var(--grey-300); border-radius: 4px; }

  /* state-fade — only the inner pieces that change */
  .pt-fade { animation: pt-fade var(--dur-base) var(--ease-standard); }
  @keyframes pt-fade {
    from { opacity: 0; transform: translateY(2px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
  <div id="root"></div>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect } = React;

/* ---------- Sidebar ---------- */
function Sidebar() {
  const items = [
    ["folder", "Projects"],
    ["layout-dashboard", "Dashboard"],
    ["image", "Gallery"],
    ["clock", "Timesheet"],
    ["palm-tree", "Leave"],
    ["calendar", "Scheduler"],
    ["clipboard", "Daywork Record"],
    ["shopping-cart", "Purchase Order"],
    ["truck", "Delivery Docket"],
    ["receipt", "Bills"],
    ["wrench", "Plant & Equipment"],
    ["users", "Resource Assigner"],
    ["building-2", "Suppliers", true],
    ["folder-open", "File Manager"],
    ["user-cog", "User Management"],
    ["wallet", "Payroll Settings"],
    ["settings", "Settings"],
  ];
  return (
    <aside className="sidebar">
      <div className="brand">Varicon</div>
      <div className="org">
        <span className="av">C</span>
        <span>Cookie's Civil</span>
      </div>
      <nav className="nav">
        {items.map(([icon, label, active], i) => (
          <a key={i} href="#" className={active ? "active" : ""}>
            <i data-lucide={icon}></i>
            <span>{label}</span>
          </a>
        ))}
      </nav>
    </aside>
  );
}

/* ---------- Suppliers list (background) ---------- */
function SuppliersBackdrop() {
  const rows = [
    ["Bunnings", "26 008 672 179", "—", "—", "—"],
    ["yuu", "—", "None", "—", "—"],
    ["Young Bros Transport", "—", "None, None, None", "—", "—"],
    ["Yarra Transport", "—", "None, None, None", "—", "—"],
    ["XYZ Corp", "—", "test City, test State, test country", "sth@exist.com", "12345678"],
    ["Xero", "—", "Hawthorn, None, Australia", "—", "—"],
    ["Woolworths Market", "—", "None", "—", "—"],
    ["Varicon Quarry Supplies", "—", "—", "—", "—"],
    ["Varicon Pty Ltd", "—", "None, VIC, Australia", "—", "—"],
    ["Varicon Nepal Suppliers", "—", "None, None, Australia", "—", "—"],
    ["Varicon Materials", "—", "—", "—", "—"],
    ["Varicon Equipment Rental", "—", "VIC, Australia", "—", "—"],
    ["Vari Sup1", "—", "for city, New South Wales, Australia", "varisup@example.com", "12345678"],
    ["Utsav Supplier", "—", "None", "—", "—"],
    ["Utsav Khadgi", "—", "None, None, None", "—", "—"],
  ];
  return (
    <div className="main">
      <div className="main-header">
        <div className="title">Suppliers</div>
        <div className="actions">
          <button className="header-btn">Initial Data Upload</button>
          <button className="header-btn search"><i data-lucide="search" style={{width:14,height:14}}></i> Search</button>
          <button className="header-btn">+ Add Supplier</button>
        </div>
      </div>
      <div className="toolbar">
        <div className="left">
          <button className="header-btn"><i data-lucide="list" style={{width:14,height:14}}></i></button>
          <input className="search-input" placeholder="Search" />
          <button className="header-btn"><i data-lucide="git-merge" style={{width:14,height:14}}></i> Merge</button>
          <button className="header-btn"><i data-lucide="refresh-cw" style={{width:14,height:14}}></i> Sync Suppliers</button>
        </div>
        <div className="right">
          <button className="header-btn primary">+ Add Supplier</button>
        </div>
      </div>
      <div className="table-wrap">
        <table className="suppliers">
          <colgroup>
            <col style={{width: "24px"}} />
            <col style={{width: "22%"}} />
            <col style={{width: "16%"}} />
            <col style={{width: "26%"}} />
            <col style={{width: "20%"}} />
            <col style={{width: "16%"}} />
          </colgroup>
          <thead>
            <tr>
              <th></th>
              <th>Supplier Name</th>
              <th>ABN</th>
              <th>Address</th>
              <th>Email</th>
              <th>Phone</th>
            </tr>
          </thead>
          <tbody>
            {rows.map((r, i) => (
              <tr key={i}>
                <td><input type="checkbox" /></td>
                {r.map((c, j) => <td key={j}>{c}</td>)}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ---------- Field components ---------- */
function TextField({ label, value, disabled, alwaysUp }) {
  const filled = !!value;
  return (
    <div className={`field ${filled ? "is-filled has-value" : ""} ${alwaysUp ? "always-up" : ""} ${disabled ? "disabled" : ""}`}>
      <input defaultValue={value || ""} disabled={disabled} placeholder="" />
      <label>{label}</label>
    </div>
  );
}

function SelectField({ label }) {
  return (
    <div className="field">
      <div className="select-shell">
        <span>{label}</span>
        <i data-lucide="chevron-down" style={{width:16,height:16,color:"var(--text-secondary)"}}></i>
      </div>
    </div>
  );
}

function PhoneField() {
  return (
    <div className="field phone">
      <span className="flag">
        <span className="au"></span>
        <i data-lucide="chevron-down" style={{width:12,height:12}}></i>
      </span>
      <input placeholder="" />
      <label style={{left: 56}}>Phone</label>
    </div>
  );
}

/* ---------- Payment Terms field (the new piece) ---------- */
function PaymentTerms({ state }) {
  const synced = state === "synced";
  return (
    <div className="pt-block">
      <div className="pt-label-row">
        <span>Payment Terms</span>
        {synced
          ? <span className="pt-badge synced">MYOB SYNCED</span>
          : <span className="pt-badge no-terms">NO TERMS</span>}
      </div>

      <div
        className={`pt-container ${synced ? "synced" : "no-terms"}`}
        role="region"
        aria-label="Payment Terms, managed by MYOB"
        aria-readonly="true"
      >
        <div className="pt-left pt-fade" key={state + "-l"}>
          {synced ? (
            <>
              <div className="pt-line1">In a Given # of Days — 30 days</div>
              <div className="pt-line2">Due date = invoice date + 30 days</div>
            </>
          ) : (
            <>
              <div className="pt-line1">No payment terms synced from MYOB</div>
              <div className="pt-line2">Due dates on bills for this supplier must be entered manually.</div>
            </>
          )}
        </div>
        {synced && (
          <div className="pt-pill pt-fade" key={state + "-r"}>Synced 25 Mar 2026</div>
        )}
      </div>

      <div className="pt-helper" key={state + "-h"}>
        {synced
          ? "Managed in MYOB AccountRight. Edit terms there and re-sync to update."
          : "No payment terms found in MYOB AccountRight for this supplier."}
      </div>
    </div>
  );
}

/* ---------- The slide-over panel ---------- */
function EditSupplierPanel({ state }) {
  return (
    <aside className="panel" role="dialog" aria-label="Edit Supplier" data-screen-label="Edit Supplier Panel">
      <header className="panel-header">
        <h2>Edit Supplier</h2>
        <button className="close" aria-label="Close">
          <i data-lucide="x" style={{width:18,height:18}}></i>
        </button>
      </header>

      <div className="panel-body">
        <TextField label="Supplier Name *" value="Bunnings" disabled />
        <TextField label="Supplier ID" value="" />
        <TextField label="ABN" value="26 008 672 179" />
        <div className="helper-link">
          You can <a href="#">search for contact's ABN here ↗</a>
        </div>

        <PhoneField />
        <TextField label="Email" value="" />
        <SelectField label="Resource Types" />

        <label className="check-row">
          <input type="checkbox" />
          <span>Report payments to ATO via TPAR</span>
          <span className="info"><i data-lucide="info"></i></span>
        </label>
        <label className="check-row">
          <input type="checkbox" />
          <span>Set as Subcontractor</span>
          <span className="info"><i data-lucide="info"></i></span>
        </label>

        {/* === NEW FIELD === */}
        <PaymentTerms state={state} />

        <div className="section-label">Address</div>
        <TextField label="Address Line 1" value="" />
        <TextField label="Address Line 2" value="" />
        <SelectField label="Country" />
        <div className="row-2">
          <SelectField label="State" />
          <TextField label="Postal Code" value="" />
        </div>

        <div className="section-label">Contact Persons</div>
        <button className="add-contact">
          <i data-lucide="plus"></i> Add Contact Person
        </button>
      </div>

      <footer className="panel-footer">
        <button className="btn ghost">Cancel</button>
        <button className="btn primary-teal">Update</button>
      </footer>
    </aside>
  );
}

/* ---------- Prototype state toggle ---------- */
function StateToggle({ state, setState }) {
  return (
    <div className="proto-toggle-bar" role="radiogroup" aria-label="Preview state">
      <span className="proto-tag">Preview</span>
      <span className="label">Payment Terms state:</span>
      <div className="seg">
        <button
          data-state="a"
          className={state === "synced" ? "is-active" : ""}
          onClick={() => setState("synced")}
          role="radio"
          aria-checked={state === "synced"}
        >
          <span className="dot" style={{background: state === "synced" ? "#185FA5" : "currentColor"}}></span>
          Synced
        </button>
        <button
          data-state="b"
          className={state === "no-terms" ? "is-active" : ""}
          onClick={() => setState("no-terms")}
          role="radio"
          aria-checked={state === "no-terms"}
        >
          <span className="dot" style={{background: state === "no-terms" ? "#BA7517" : "currentColor"}}></span>
          No Terms
        </button>
      </div>
    </div>
  );
}

/* ---------- App ---------- */
function App() {
  const [state, setState] = useState("synced");

  useEffect(() => {
    if (window.lucide) window.lucide.createIcons();
  });

  return (
    <>
      <StateToggle state={state} setState={setState} />
      <div className="app-shell" aria-hidden="true">
        <Sidebar />
        <SuppliersBackdrop />
      </div>
      <div className="scrim"></div>
      <EditSupplierPanel state={state} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
