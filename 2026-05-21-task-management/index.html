<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tasks</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #143666;
      --primary-light: #1e4a8a;
      --accent: #F2AD3E;
      --accent-soft: #fff4dd;
      --bg: #f7f8fb;
      --surface: #ffffff;
      --sidebar: #fafbfd;
      --text: #1a1f2e;
      --muted: #6b7280;
      --subtle: #9ca3af;
      --border: #e6e8ee;
      --border-strong: #d4d7de;
      --hover: #f1f3f7;
      --selected: #eaf0fa;
      --green: #16a34a;
      --green-soft: #e7f7ec;
      --red: #dc2626;
      --red-soft: #fce8e8;
      --amber: #d97706;
      --amber-soft: #fef3c7;
      --blue: #2563eb;
      --blue-soft: #e0ecff;
      --purple: #7c3aed;
      --purple-soft: #ede4fd;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
      color: inherit;
      font-size: inherit;
    }

    input, textarea, select {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }

    /* ── App layout ── */
    .app {
      display: grid;
      grid-template-columns: 248px 1fr 360px;
      height: 100vh;
      background: var(--surface);
    }

    /* ── Sidebar ── */
    .sidebar {
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 18px 18px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 14px;
    }

    .app-name {
      font-weight: 600;
      font-size: 15px;
      color: var(--primary);
    }

    .sidebar-search {
      margin: 0 14px 12px;
      position: relative;
    }

    .sidebar-search input {
      width: 100%;
      padding: 8px 10px 8px 32px;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 7px;
      font-size: 13px;
      outline: none;
      transition: border 0.15s;
    }

    .sidebar-search input:focus {
      border-color: var(--primary);
    }

    .sidebar-search svg {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--subtle);
      pointer-events: none;
    }

    .sidebar-section {
      padding: 6px 8px;
    }

    .sidebar-section-title {
      padding: 8px 12px 4px;
      font-size: 11px;
      font-weight: 600;
      color: var(--subtle);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar-section-title button {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--subtle);
      transition: background 0.15s, color 0.15s;
    }

    .sidebar-section-title button:hover {
      background: var(--hover);
      color: var(--text);
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.12s;
      color: var(--text);
      font-size: 13.5px;
      user-select: none;
    }

    .nav-item:hover { background: var(--hover); }
    .nav-item.active {
      background: var(--selected);
      color: var(--primary);
      font-weight: 500;
    }

    .nav-item .icon {
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
    }
    .nav-item.active .icon { color: var(--primary); }

    .nav-item .label { flex: 1; }

    .nav-item .count {
      font-size: 12px;
      color: var(--subtle);
      font-weight: 500;
    }
    .nav-item.active .count { color: var(--primary); }

    .nav-item .project-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
    }

    .sidebar-footer {
      margin-top: auto;
      padding: 12px 14px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #e08a1d);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 12px;
    }

    .user-info { flex: 1; min-width: 0; }
    .user-name { font-size: 13px; font-weight: 500; }
    .user-email { font-size: 11.5px; color: var(--subtle); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ── Main ── */
    .main {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--surface);
    }

    .main-header {
      padding: 22px 32px 8px;
      border-bottom: 1px solid var(--border);
    }

    .main-header-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .main-title-block { flex: 1; min-width: 0; }

    .main-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .main-subtitle {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
    }

    .main-actions { display: flex; gap: 8px; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      transition: background 0.12s, border-color 0.12s, color 0.12s;
      border: 1px solid transparent;
    }

    .btn-icon {
      padding: 6px;
      border-radius: 6px;
      color: var(--muted);
    }
    .btn-icon:hover { background: var(--hover); color: var(--text); }

    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border-color: var(--border-strong);
    }
    .btn-secondary:hover { background: var(--hover); }

    .btn-primary {
      background: var(--primary);
      color: white;
    }
    .btn-primary:hover { background: var(--primary-light); }

    .filter-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 12px 0 14px;
      flex-wrap: wrap;
    }

    .filter-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12.5px;
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--border-strong);
      transition: all 0.12s;
    }
    .filter-chip:hover { background: var(--hover); color: var(--text); }
    .filter-chip.active {
      background: var(--selected);
      color: var(--primary);
      border-color: transparent;
      font-weight: 500;
    }

    .filter-divider {
      width: 1px;
      height: 16px;
      background: var(--border);
      margin: 0 4px;
    }

    /* ── Task list ── */
    .task-list-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 8px 24px 80px;
    }

    .task-group-header {
      padding: 18px 8px 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--subtle);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .task-group-header:first-child { padding-top: 8px; }

    .add-task-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 8px;
      border-radius: 8px;
      cursor: text;
      color: var(--subtle);
      font-size: 13.5px;
      transition: background 0.12s, color 0.12s;
      margin-bottom: 2px;
    }
    .add-task-row:hover { background: var(--hover); color: var(--muted); }

    .add-task-row .plus {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.5px dashed var(--subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 18px;
    }

    .add-task-input-wrap {
      padding: 6px 8px;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--primary);
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .add-task-input-wrap input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-size: 14px;
      padding: 4px 0;
    }

    .task {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 10px 8px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.12s;
      border-bottom: 1px solid var(--border);
    }
    .task:hover { background: var(--hover); }
    .task.selected { background: var(--selected); }
    .task.completed .task-title { color: var(--subtle); text-decoration: line-through; }
    .task.completed .task-meta { opacity: 0.6; }

    .checkbox {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.5px solid var(--border-strong);
      flex: 0 0 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 1px;
      transition: all 0.12s;
      background: var(--surface);
    }
    .checkbox.priority-1 { border-color: var(--red); }
    .checkbox.priority-2 { border-color: var(--amber); }
    .checkbox.priority-3 { border-color: var(--blue); }
    .checkbox:hover { background: var(--hover); }
    .checkbox.checked {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }
    .checkbox.checked.priority-1 { background: var(--red); border-color: var(--red); }
    .checkbox.checked.priority-2 { background: var(--amber); border-color: var(--amber); }
    .checkbox.checked.priority-3 { background: var(--blue); border-color: var(--blue); }
    .checkbox svg { opacity: 0; transition: opacity 0.12s; }
    .checkbox.checked svg { opacity: 1; }

    .task-body { flex: 1; min-width: 0; }

    .task-title {
      font-size: 14px;
      color: var(--text);
      line-height: 1.4;
    }

    .task-desc {
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
    }

    .task-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 4px;
      font-size: 12px;
      color: var(--muted);
    }

    .meta-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .meta-chip.overdue { color: var(--red); font-weight: 500; }
    .meta-chip.today { color: var(--amber); font-weight: 500; }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 1px 7px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 500;
    }
    .tag-work { background: var(--blue-soft); color: var(--blue); }
    .tag-personal { background: var(--purple-soft); color: var(--purple); }
    .tag-urgent { background: var(--red-soft); color: var(--red); }
    .tag-health { background: var(--green-soft); color: var(--green); }
    .tag-learning { background: var(--amber-soft); color: var(--amber); }

    .task-project-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--subtle);
    }
    .empty-icon {
      font-size: 36px;
      margin-bottom: 10px;
    }
    .empty-title { font-size: 15px; font-weight: 500; color: var(--muted); margin-bottom: 4px; }

    /* ── Detail pane ── */
    .detail {
      border-left: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .detail-empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: var(--subtle);
      padding: 40px 24px;
      text-align: center;
    }
    .detail-empty svg { margin-bottom: 12px; opacity: 0.5; }

    .detail-header {
      padding: 18px 22px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .detail-breadcrumb {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .detail-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px 22px;
    }

    .detail-task-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 18px;
    }
    .detail-task-row .checkbox { width: 20px; height: 20px; flex: 0 0 20px; margin-top: 2px; }

    .detail-title {
      font-size: 17px;
      font-weight: 600;
      line-height: 1.4;
      flex: 1;
      outline: none;
      border-radius: 4px;
      padding: 1px 2px;
    }
    .detail-title:focus { background: var(--hover); }
    .detail-title.completed { color: var(--subtle); text-decoration: line-through; }

    .detail-desc {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
      padding: 6px 30px 6px 30px;
      outline: none;
      border-radius: 4px;
      min-height: 24px;
      white-space: pre-wrap;
    }
    .detail-desc:focus { background: var(--hover); }
    .detail-desc.empty::before {
      content: 'Add a description...';
      color: var(--subtle);
      font-style: italic;
    }

    .detail-divider {
      height: 1px;
      background: var(--border);
      margin: 16px 0;
    }

    .detail-field {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 0;
      font-size: 13px;
    }
    .detail-field-label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      width: 100px;
      flex: 0 0 100px;
    }
    .detail-field-value {
      flex: 1;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 5px;
      transition: background 0.12s;
    }
    .detail-field-value:hover { background: var(--hover); }
    .detail-field-value.empty { color: var(--subtle); }

    .priority-flag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 500;
    }
    .priority-flag.p1 { color: var(--red); }
    .priority-flag.p2 { color: var(--amber); }
    .priority-flag.p3 { color: var(--blue); }
    .priority-flag.p4 { color: var(--muted); }

    .detail-section-title {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--subtle);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 20px 0 8px;
    }

    .subtask {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 4px;
      border-radius: 5px;
      font-size: 13px;
      transition: background 0.12s;
    }
    .subtask:hover { background: var(--hover); }
    .subtask .checkbox { width: 15px; height: 15px; flex: 0 0 15px; margin: 0; }
    .subtask .checkbox svg { width: 9px; height: 9px; }
    .subtask span { flex: 1; }
    .subtask.done span { color: var(--subtle); text-decoration: line-through; }

    .add-subtask {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 4px;
      color: var(--subtle);
      font-size: 13px;
      cursor: pointer;
      border-radius: 5px;
    }
    .add-subtask:hover { color: var(--muted); }

    .activity-item {
      display: flex;
      gap: 10px;
      padding: 6px 0;
      font-size: 12.5px;
      color: var(--muted);
    }
    .activity-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--border-strong);
      margin-top: 7px;
      flex: 0 0 6px;
    }

    /* ── Dropdowns ── */
    .popover {
      position: absolute;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12), 0 2px 6px rgba(0,0,0,0.05);
      padding: 6px;
      z-index: 1000;
      min-width: 180px;
    }
    .popover-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 10px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.12s;
    }
    .popover-item:hover { background: var(--hover); }
    .popover-item.danger { color: var(--red); }
    .popover-divider { height: 1px; background: var(--border); margin: 4px 0; }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(20, 30, 60, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 24px;
    }
    .modal {
      background: var(--surface);
      border-radius: 12px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.25);
      padding: 24px;
    }
    .modal h3 { font-size: 17px; margin-bottom: 14px; }
    .modal input {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border-strong);
      border-radius: 7px;
      outline: none;
      font-size: 14px;
    }
    .modal input:focus { border-color: var(--primary); }
    .modal-color-row {
      display: flex;
      gap: 8px;
      margin: 14px 0 18px;
    }
    .color-swatch {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.12s;
    }
    .color-swatch:hover { transform: scale(1.1); }
    .color-swatch.selected { border-color: var(--text); }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--subtle); }
  </style>
</head>
<body>
  <div class="app" id="app"></div>

      ],

    };

    // ── Helpers ──
    function fmtDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      const diff = Math.round((d - today) / 86400000);
      if (diff === 0) return 'Today';
      if (diff === 1) return 'Tomorrow';
      if (diff === -1) return 'Yesterday';
      if (diff < 0) return d.toLocaleDateString('en', { month: 'short', day: 'numeric' }) + ' · overdue';
      if (diff < 7) return d.toLocaleDateString('en', { weekday: 'long' });
      return d.toLocaleDateString('en', { month: 'short', day: 'numeric' });
    }

    function dateState(iso) {
      if (!iso) return null;
      const d = new Date(iso);
      const diff = Math.round((d - today) / 86400000);
      if (diff < 0) return 'overdue';
      if (diff === 0) return 'today';
      return null;
    }

    function priorityLabel(p) {
      return { 1: 'Priority 1', 2: 'Priority 2', 3: 'Priority 3', 4: 'No priority' }[p] || 'No priority';
    }

    function getProject(id) { return state.projects.find(p => p.id === id); }
    function getTag(id) { return state.tags.find(t => t.id === id); }
    function getTask(id) { return state.tasks.find(t => t.id === id); }

    function filteredTasks() {
      let list = state.tasks.slice();
      const v = state.view;

      if (v.type === 'smart') {
        if (v.id === 'today') {
          list = list.filter(t => t.due && new Date(t.due) <= today);
        } else if (v.id === 'upcoming') {
          list = list.filter(t => t.due && new Date(t.due) > today);
        } else if (v.id === 'inbox') {
          list = list.filter(t => t.projectId === 'p1' || !t.projectId);
        } else if (v.id === 'all') {
          // all
        } else if (v.id === 'completed') {
          list = list.filter(t => t.done);
        }
      } else if (v.type === 'project') {
        list = list.filter(t => t.projectId === v.id);
      } else if (v.type === 'tag') {
        list = list.filter(t => (t.tagIds || []).includes(v.id));
      }

      if (v.id !== 'completed' && !state.showCompleted) {
        list = list.filter(t => !t.done);
      }

      if (state.search) {
        const q = state.search.toLowerCase();
        list = list.filter(t => t.title.toLowerCase().includes(q) || (t.desc || '').toLowerCase().includes(q));
      }

      if (state.sort === 'priority') {
        list.sort((a, b) => a.priority - b.priority);
      } else if (state.sort === 'date') {
        list.sort((a, b) => {
          if (!a.due && !b.due) return 0;
          if (!a.due) return 1;
          if (!b.due) return -1;
          return new Date(a.due) - new Date(b.due);
        });
      }

      return list;
    }

    function groupTasks(list) {
      const v = state.view;
      if (v.type === 'smart' && v.id === 'today') {
        const overdue = list.filter(t => dateState(t.due) === 'overdue');
        const today_ = list.filter(t => dateState(t.due) === 'today');
        const groups = [];
        if (overdue.length) groups.push({ name: 'Overdue', tasks: overdue });
        if (today_.length) groups.push({ name: 'Today', tasks: today_ });
        return groups;
      }
      if (v.type === 'smart' && v.id === 'upcoming') {
        const map = {};
        list.forEach(t => {
          const key = fmtDate(t.due);
          if (!map[key]) map[key] = [];
          map[key].push(t);
        });
        return Object.entries(map).map(([name, tasks]) => ({ name, tasks }));
      }
      return [{ name: null, tasks: list }];
    }

    function viewTitle() {
      const v = state.view;
      if (v.type === 'smart') {
        return { today: 'Today', upcoming: 'Upcoming', inbox: 'Inbox', all: 'All tasks', completed: 'Completed' }[v.id];
      }
      if (v.type === 'project') return getProject(v.id)?.name || 'Project';
      if (v.type === 'tag') return '#' + (getTag(v.id)?.name || 'tag');
      return '';
    }

    function viewSubtitle() {
      const list = filteredTasks();
      const open = list.filter(t => !t.done).length;
      const v = state.view;
      if (v.type === 'smart' && v.id === 'today') {
        const d = today.toLocaleDateString('en', { weekday: 'long', month: 'long', day: 'numeric' });
        return `${d} · ${open} ${open === 1 ? 'task' : 'tasks'}`;
      }
      return `${open} ${open === 1 ? 'task' : 'tasks'}`;
    }

    // ── Render ──
    function render() {
      const app = document.getElementById('app');
      app.innerHTML = renderSidebar() + renderMain() + renderDetail();
      attach();
      if (state.modal) {
        document.body.insertAdjacentHTML('beforeend', renderModal());
        attachModal();
      }
      if (state.popover) {
        document.body.insertAdjacentHTML('beforeend', renderPopover());
        attachPopover();
      }
    }

    function renderSidebar() {
      const counts = {
        today: state.tasks.filter(t => !t.done && t.due && new Date(t.due) <= today).length,
        upcoming: state.tasks.filter(t => !t.done && t.due && new Date(t.due) > today).length,
        inbox: state.tasks.filter(t => !t.done && (t.projectId === 'p1' || !t.projectId)).length,
        all: state.tasks.filter(t => !t.done).length,
      };

      const isActive = (type, id) => state.view.type === type && state.view.id === id ? 'active' : '';

      const projectItems = state.projects.filter(p => !p.system).map(p => {
        const count = state.tasks.filter(t => !t.done && t.projectId === p.id).length;
        return `
          <div class="nav-item ${isActive('project', p.id)}" data-action="view" data-type="project" data-id="${p.id}">
            <span class="icon"><span class="project-dot" style="background:${p.color}"></span></span>
            <span class="label">${p.name}</span>
            <span class="count">${count || ''}</span>
          </div>`;
      }).join('');

      const tagItems = state.tags.map(t => {
        const count = state.tasks.filter(task => !task.done && (task.tagIds || []).includes(t.id)).length;
        return `
          <div class="nav-item ${isActive('tag', t.id)}" data-action="view" data-type="tag" data-id="${t.id}">
            <span class="icon" style="font-size:13px;color:var(--subtle);">#</span>
            <span class="label">${t.name}</span>
            <span class="count">${count || ''}</span>
          </div>`;
      }).join('');

      return `
        <aside class="sidebar">
          <div class="sidebar-header">
            <div class="logo">T</div>
            <div class="app-name">Tasks</div>
          </div>
          <div class="sidebar-search">
            ${icons.search}
            <input type="text" placeholder="Search" value="${state.search}" data-action="search" />
          </div>
          <div class="sidebar-section" style="flex:0 0 auto;">
            <div class="nav-item ${isActive('smart', 'inbox')}" data-action="view" data-type="smart" data-id="inbox">
              <span class="icon">${icons.inbox}</span>
              <span class="label">Inbox</span>
              <span class="count">${counts.inbox || ''}</span>
            </div>
            <div class="nav-item ${isActive('smart', 'today')}" data-action="view" data-type="smart" data-id="today">
              <span class="icon" style="color:${state.view.id === 'today' ? 'var(--primary)' : 'var(--accent)'}">${icons.today}</span>
              <span class="label">Today</span>
              <span class="count">${counts.today || ''}</span>
            </div>
            <div class="nav-item ${isActive('smart', 'upcoming')}" data-action="view" data-type="smart" data-id="upcoming">
              <span class="icon">${icons.upcoming}</span>
              <span class="label">Upcoming</span>
              <span class="count">${counts.upcoming || ''}</span>
            </div>
            <div class="nav-item ${isActive('smart', 'all')}" data-action="view" data-type="smart" data-id="all">
              <span class="icon">${icons.all}</span>
              <span class="label">All tasks</span>
              <span class="count">${counts.all || ''}</span>
            </div>
            <div class="nav-item ${isActive('smart', 'completed')}" data-action="view" data-type="smart" data-id="completed">
              <span class="icon">${icons.done}</span>
              <span class="label">Completed</span>
            </div>
          </div>
          <div class="sidebar-section" style="flex:1 1 auto;overflow-y:auto;min-height:0;">
            <div class="sidebar-section-title">
              <span>Projects</span>
              <button data-action="new-project" title="New project">${icons.plus}</button>
            </div>
            ${projectItems}
            <div class="sidebar-section-title" style="margin-top:8px;">
              <span>Tags</span>
            </div>
            ${tagItems}
          </div>
          <div class="sidebar-footer">
            <div class="avatar">AN</div>
            <div class="user-info">
              <div class="user-name">Alec</div>
              <div class="user-email">alec@example.com</div>
            </div>
            <button class="btn-icon" title="Settings">${icons.more}</button>
          </div>
        </aside>`;
    }

    function renderMain() {
      const groups = groupTasks(filteredTasks());
      const v = state.view;

      let body;
      if (groups.length === 0 || groups.every(g => g.tasks.length === 0)) {
        body = `
          <div class="empty">
            <div class="empty-icon">${icons.clipboard}</div>
            <div class="empty-title">Nothing to do here</div>
            <div>You're all caught up. Add a task to get started.</div>
          </div>`;
      } else {
        body = groups.map(g => {
          const header = g.name ? `<div class="task-group-header">${g.name} · ${g.tasks.length}</div>` : '';
          const tasks = g.tasks.map(renderTaskRow).join('');
          return header + tasks;
        }).join('');
      }

      const addInGroup = state.addingInGroup === 'main';
      const addRow = addInGroup
        ? `<div class="add-task-input-wrap">
             <div style="width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border-strong);flex:0 0 18px;"></div>
             <input type="text" id="add-input" placeholder="Task name" value="${state.addInput}" autofocus />
             <button class="btn btn-secondary" data-action="cancel-add">Cancel</button>
             <button class="btn btn-primary" data-action="confirm-add">Add</button>
           </div>`
        : `<div class="add-task-row" data-action="start-add">
             <span class="plus">${icons.plus}</span>
             <span>Add task</span>
           </div>`;

      const sortLabel = { manual: 'Manual', priority: 'Priority', date: 'Date' }[state.sort];

      return `
        <section class="main">
          <div class="main-header">
            <div class="main-header-row">
              <div class="main-title-block">
                <div class="main-title">${viewTitle()}</div>
                <div class="main-subtitle">${viewSubtitle()}</div>
              </div>
              <div class="main-actions">
                <button class="btn btn-icon" title="Sort" data-action="cycle-sort">${icons.sort}<span style="margin-left:4px;font-size:12px;">${sortLabel}</span></button>
                <button class="btn btn-icon ${state.showCompleted ? 'active' : ''}" title="${state.showCompleted ? 'Hide completed' : 'Show completed'}" data-action="toggle-completed">${icons.eye}</button>
                <button class="btn btn-icon" title="More">${icons.more}</button>
              </div>
            </div>
            <div class="filter-row">
              <button class="filter-chip ${state.sort === 'manual' ? 'active' : ''}" data-action="set-sort" data-sort="manual">Manual</button>
              <button class="filter-chip ${state.sort === 'priority' ? 'active' : ''}" data-action="set-sort" data-sort="priority">By priority</button>
              <button class="filter-chip ${state.sort === 'date' ? 'active' : ''}" data-action="set-sort" data-sort="date">By date</button>
              <div class="filter-divider"></div>
              <button class="filter-chip ${state.showCompleted ? 'active' : ''}" data-action="toggle-completed">${state.showCompleted ? 'Hiding' : 'Show'} completed</button>
            </div>
          </div>
          <div class="task-list-wrap">
            ${addRow}
            ${body}
          </div>
        </section>`;
    }

    function renderTaskRow(t) {
      const project = getProject(t.projectId);
      const tags = (t.tagIds || []).map(id => getTag(id)).filter(Boolean);
      const ds = dateState(t.due);
      const dateChip = t.due ? `<span class="meta-chip ${ds || ''}">${icons.calendar}${fmtDate(t.due)}</span>` : '';
      const projChip = project && !project.system ? `<span class="meta-chip"><span class="task-project-dot" style="background:${project.color}"></span>${project.name}</span>` : '';
      const tagChips = tags.map(tg => `<span class="tag ${tg.cls}">#${tg.name}</span>`).join('');
      const subtaskInfo = t.subtasks && t.subtasks.length
        ? `<span class="meta-chip">${icons.done}${t.subtasks.filter(s => s.done).length}/${t.subtasks.length}</span>`
        : '';
      const descLine = t.desc ? `<div class="task-desc">${escapeHtml(t.desc)}</div>` : '';

      return `
        <div class="task ${t.done ? 'completed' : ''} ${state.selectedTaskId === t.id ? 'selected' : ''}" data-action="select" data-id="${t.id}">
          <div class="checkbox ${t.done ? 'checked' : ''} priority-${t.priority}" data-action="toggle" data-id="${t.id}">${icons.check}</div>
          <div class="task-body">
            <div class="task-title">${escapeHtml(t.title)}</div>
            ${descLine}
            <div class="task-meta">
              ${dateChip}
              ${projChip}
              ${subtaskInfo}
              ${tagChips}
            </div>
          </div>
        </div>`;
    }

    function renderDetail() {
      const t = state.selectedTaskId ? getTask(state.selectedTaskId) : null;
      if (!t) {
        return `
          <aside class="detail">
            <div class="detail-empty">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M9 11l3 3l8 -8"/><path d="M20 12v6a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-12a2 2 0 0 1 2 -2h9"/></svg>
              <div>Select a task to see details</div>
            </div>
          </aside>`;
      }

      const project = getProject(t.projectId);
      const tags = (t.tagIds || []).map(id => getTag(id)).filter(Boolean);
      const subtasks = (t.subtasks || []).map(s => `
        <div class="subtask ${s.done ? 'done' : ''}" data-action="toggle-subtask" data-tid="${t.id}" data-sid="${s.id}">
          <div class="checkbox ${s.done ? 'checked' : ''}">${icons.check}</div>
          <span>${escapeHtml(s.title)}</span>
        </div>`).join('');

      return `
        <aside class="detail">
          <div class="detail-header">
            <div class="detail-breadcrumb">
              ${project && !project.system ? `<span class="task-project-dot" style="background:${project.color}"></span>${project.name}` : 'Inbox'}
            </div>
            <div style="display:flex;gap:4px;">
              <button class="btn-icon" data-action="delete-task" data-id="${t.id}" title="Delete">${icons.trash}</button>
              <button class="btn-icon" data-action="close-detail" title="Close">${icons.close}</button>
            </div>
          </div>
          <div class="detail-body">
            <div class="detail-task-row">
              <div class="checkbox ${t.done ? 'checked' : ''} priority-${t.priority}" data-action="toggle" data-id="${t.id}">${icons.check}</div>
              <div class="detail-title ${t.done ? 'completed' : ''}" contenteditable="true" data-action="edit-title" data-id="${t.id}">${escapeHtml(t.title)}</div>
            </div>
            <div class="detail-desc ${!t.desc ? 'empty' : ''}" contenteditable="true" data-action="edit-desc" data-id="${t.id}">${escapeHtml(t.desc || '')}</div>

            <div class="detail-divider"></div>

            <div class="detail-field">
              <div class="detail-field-label">${icons.calendar}<span>Due</span></div>
              <div class="detail-field-value ${!t.due ? 'empty' : ''}" data-action="edit-due" data-id="${t.id}">${t.due ? fmtDate(t.due) : 'Set due date'}</div>
            </div>
            <div class="detail-field">
              <div class="detail-field-label"><span class="priority-flag p${t.priority}">${t.priority === 4 ? icons.flagOutline : icons.flag}</span><span>Priority</span></div>
              <div class="detail-field-value"><span class="priority-flag p${t.priority}" data-action="cycle-priority" data-id="${t.id}">${priorityLabel(t.priority)}</span></div>
            </div>
            <div class="detail-field">
              <div class="detail-field-label">${icons.folder}<span>Project</span></div>
              <div class="detail-field-value" data-action="cycle-project" data-id="${t.id}">
                ${project && !project.system ? `<span class="task-project-dot" style="background:${project.color};display:inline-block;margin-right:6px;"></span>${project.name}` : 'Inbox'}
              </div>
            </div>
            <div class="detail-field" style="align-items:flex-start;">
              <div class="detail-field-label" style="padding-top:6px;">${icons.tag}<span>Tags</span></div>
              <div class="detail-field-value" data-action="cycle-tag" data-id="${t.id}" style="display:flex;flex-wrap:wrap;gap:4px;">
                ${tags.length ? tags.map(tg => `<span class="tag ${tg.cls}">#${tg.name}</span>`).join('') : '<span style="color:var(--subtle);">Add tags</span>'}
              </div>
            </div>

            <div class="detail-section-title">Subtasks</div>
            ${subtasks}
            <div class="add-subtask" data-action="add-subtask" data-id="${t.id}">
              ${icons.plus14}
              <span>Add subtask</span>
            </div>

            <div class="detail-section-title">Activity</div>
            <div class="activity-item"><div class="activity-dot"></div><div>Created May 18 · You</div></div>
            ${t.done ? '<div class="activity-item"><div class="activity-dot" style="background:var(--green);"></div><div>Completed just now</div></div>' : ''}
          </div>
        </aside>`;
    }

    function renderModal() {
      const m = state.modal;
      if (m.type === 'newProject') {
        const colors = ['#2563eb', '#7c3aed', '#16a34a', '#d97706', '#dc2626', '#0891b2', '#db2777', '#6b7280'];
        const swatches = colors.map(c => `
          <div class="color-swatch ${state.modalDraft.color === c ? 'selected' : ''}"
               style="background:${c}" data-action="modal-color" data-color="${c}"></div>`).join('');
        return `
          <div class="modal-overlay" data-action="close-modal">
            <div class="modal" onclick="event.stopPropagation()">
              <h3>New project</h3>
              <input type="text" id="modal-input" placeholder="Project name" value="${state.modalDraft.name}" />
              <div class="modal-color-row">${swatches}</div>
              <div class="modal-actions">
                <button class="btn btn-secondary" data-action="close-modal">Cancel</button>
                <button class="btn btn-primary" data-action="modal-confirm">Add</button>
              </div>
            </div>
          </div>`;
      }
      return '';
    }

    function renderPopover() {
      const p = state.popover;
      const t = getTask(p.taskId);
      if (!t) return '';
      const style = `top:${p.y}px; left:${p.x}px;`;

      if (p.type === 'priority') {
        const items = [1, 2, 3, 4].map(n => `
          <div class="popover-item" data-action="set-priority" data-id="${t.id}" data-p="${n}">
            <span class="priority-flag p${n}">${n === 4 ? icons.flagOutline : icons.flag}</span>
            ${priorityLabel(n)}
          </div>`).join('');
        return `<div class="popover" style="${style}">${items}</div>`;
      }
      if (p.type === 'project') {
        const items = state.projects.map(pr => `
          <div class="popover-item" data-action="set-project" data-id="${t.id}" data-pid="${pr.id}">
            <span class="task-project-dot" style="background:${pr.color}"></span>
            ${pr.name}
          </div>`).join('');
        return `<div class="popover" style="${style}">${items}</div>`;
      }
      if (p.type === 'tag') {
        const items = state.tags.map(tg => {
          const active = (t.tagIds || []).includes(tg.id);
          return `
            <div class="popover-item" data-action="toggle-tag" data-id="${t.id}" data-tid="${tg.id}">
              <span class="tag ${tg.cls}">#${tg.name}</span>
              <span style="margin-left:auto;color:var(--primary);visibility:${active ? 'visible' : 'hidden'};">${icons.check}</span>
            </div>`;
        }).join('');
        return `<div class="popover" style="${style}">${items}</div>`;
      }
      if (p.type === 'due') {
        const opts = [
          { label: 'Today', value: '2026-05-21' },
          { label: 'Tomorrow', value: '2026-05-22' },
          { label: 'This weekend', value: '2026-05-23' },
          { label: 'Next week', value: '2026-05-25' },
          { label: 'No date', value: null },
        ];
        const items = opts.map(o => `
          <div class="popover-item" data-action="set-due" data-id="${t.id}" data-due="${o.value || ''}">
            ${icons.calendar} ${o.label}
            ${o.value ? `<span style="margin-left:auto;color:var(--subtle);font-size:11.5px;">${o.value === '2026-05-21' ? 'Thu' : o.value === '2026-05-22' ? 'Fri' : o.value === '2026-05-23' ? 'Sat' : 'Mon'}</span>` : ''}
          </div>`).join('');
        return `<div class="popover" style="${style}">${items}</div>`;
      }
      return '';
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // ── Events ──
    function attach() {
      document.querySelectorAll('[data-action]').forEach(el => {
        el.addEventListener('click', handleClick);
      });
      const search = document.querySelector('input[data-action="search"]');
      if (search) {
        search.addEventListener('input', e => {
          state.search = e.target.value;
          renderAndRestoreFocus('input[data-action="search"]');
        });
      }
      const addInput = document.getElementById('add-input');
      if (addInput) {
        addInput.focus();
        addInput.setSelectionRange(addInput.value.length, addInput.value.length);
        addInput.addEventListener('input', e => { state.addInput = e.target.value; });
        addInput.addEventListener('keydown', e => {
          if (e.key === 'Enter') { e.preventDefault(); confirmAdd(); }
          if (e.key === 'Escape') { cancelAdd(); }
        });
      }
      document.querySelectorAll('[contenteditable]').forEach(el => {
        el.addEventListener('blur', e => {
          const id = parseInt(el.dataset.id);
          const t = getTask(id);
          if (!t) return;
          if (el.dataset.action === 'edit-title') {
            const v = el.innerText.trim();
            if (v && v !== t.title) { t.title = v; render(); }
          } else if (el.dataset.action === 'edit-desc') {
            const v = el.innerText.trim();
            if (v !== t.desc) { t.desc = v; render(); }
          }
        });
        el.addEventListener('keydown', e => {
          if (e.key === 'Enter' && el.dataset.action === 'edit-title' && !e.shiftKey) {
            e.preventDefault();
            el.blur();
          }
        });
      });
    }

    function renderAndRestoreFocus(selector) {
      render();
      const el = document.querySelector(selector);
      if (el) {
        el.focus();
        if (el.setSelectionRange) el.setSelectionRange(el.value.length, el.value.length);
      }
    }

    function handleClick(e) {
      const el = e.currentTarget;
      const action = el.dataset.action;
      e.stopPropagation();

      switch (action) {
        case 'view':
          state.view = { type: el.dataset.type, id: el.dataset.id };
          state.selectedTaskId = null;
          state.addingInGroup = null;
          render();
          break;
        case 'select':
          state.selectedTaskId = parseInt(el.dataset.id);
          render();
          break;
        case 'toggle': {
          const t = getTask(parseInt(el.dataset.id));
          if (t) { t.done = !t.done; render(); }
          break;
        }
        case 'toggle-subtask': {
          const t = getTask(parseInt(el.dataset.tid));
          const s = t?.subtasks.find(s => s.id === parseInt(el.dataset.sid));
          if (s) { s.done = !s.done; render(); }
          break;
        }
        case 'start-add':
          state.addingInGroup = 'main';
          state.addInput = '';
          render();
          break;
        case 'cancel-add':
          cancelAdd();
          break;
        case 'confirm-add':
          confirmAdd();
          break;
        case 'cycle-sort':
          state.sort = state.sort === 'manual' ? 'priority' : state.sort === 'priority' ? 'date' : 'manual';
          render();
          break;
        case 'set-sort':
          state.sort = el.dataset.sort;
          render();
          break;
        case 'toggle-completed':
          state.showCompleted = !state.showCompleted;
          render();
          break;
        case 'close-detail':
          state.selectedTaskId = null;
          render();
          break;
        case 'delete-task': {
          const id = parseInt(el.dataset.id);
          state.tasks = state.tasks.filter(t => t.id !== id);
          if (state.selectedTaskId === id) state.selectedTaskId = null;
          render();
          break;
        }
        case 'cycle-priority': {
          const rect = el.getBoundingClientRect();
          openPopover('priority', parseInt(el.dataset.id), rect);
          break;
        }
        case 'cycle-project': {
          const rect = el.getBoundingClientRect();
          openPopover('project', parseInt(el.dataset.id), rect);
          break;
        }
        case 'cycle-tag': {
          const rect = el.getBoundingClientRect();
          openPopover('tag', parseInt(el.dataset.id), rect);
          break;
        }
        case 'edit-due': {
          const rect = el.getBoundingClientRect();
          openPopover('due', parseInt(el.dataset.id), rect);
          break;
        }
        case 'set-priority': {
          const t = getTask(parseInt(el.dataset.id));
          if (t) t.priority = parseInt(el.dataset.p);
          state.popover = null;
          render();
          break;
        }
        case 'set-project': {
          const t = getTask(parseInt(el.dataset.id));
          if (t) t.projectId = el.dataset.pid;
          state.popover = null;
          render();
          break;
        }
        case 'toggle-tag': {
          const t = getTask(parseInt(el.dataset.id));
          const tid = el.dataset.tid;
          if (t) {
            t.tagIds = t.tagIds || [];
            if (t.tagIds.includes(tid)) t.tagIds = t.tagIds.filter(x => x !== tid);
            else t.tagIds.push(tid);
          }
          render();
          break;
        }
        case 'set-due': {
          const t = getTask(parseInt(el.dataset.id));
          if (t) t.due = el.dataset.due || null;
          state.popover = null;
          render();
          break;
        }
        case 'add-subtask': {
          const t = getTask(parseInt(el.dataset.id));
          if (t) {
            const name = prompt('Subtask name:');
            if (name) {
              t.subtasks = t.subtasks || [];
              t.subtasks.push({ id: Date.now(), title: name, done: false });
              render();
            }
          }
          break;
        }
        case 'new-project':
          state.modal = { type: 'newProject' };
          state.modalDraft = { name: '', color: '#2563eb' };
          render();
          break;
        case 'close-modal':
          state.modal = null;
          render();
          break;
        case 'modal-color':
          state.modalDraft.color = el.dataset.color;
          render();
          break;
        case 'modal-confirm': {
          if (state.modal?.type === 'newProject') {
            const name = state.modalDraft.name.trim();
            if (name) {
              const id = 'p' + (state.projects.length + 10);
              state.projects.push({ id, name, color: state.modalDraft.color });
              state.view = { type: 'project', id };
              state.modal = null;
              render();
            }
          }
          break;
        }
      }
    }

    function openPopover(type, taskId, rect) {
      state.popover = {
        type,
        taskId,
        x: rect.left,
        y: rect.bottom + 4,
      };
      render();
    }

    function attachPopover() {
      document.querySelectorAll('.popover [data-action]').forEach(el => {
        el.addEventListener('click', handleClick);
      });
      setTimeout(() => {
        document.addEventListener('click', closePopoverOnce, { once: true });
      }, 0);
    }
    function closePopoverOnce(e) {
      if (e.target.closest('.popover')) return;
      state.popover = null;
      render();
    }

    function attachModal() {
      document.querySelectorAll('.modal [data-action], .modal-overlay').forEach(el => {
        el.addEventListener('click', handleClick);
      });
      const input = document.getElementById('modal-input');
      if (input) {
        input.focus();
        input.addEventListener('input', e => { state.modalDraft.name = e.target.value; });
        input.addEventListener('keydown', e => {
          if (e.key === 'Enter') {
            const name = state.modalDraft.name.trim();
            if (name) {
              const id = 'p' + (state.projects.length + 10);
              state.projects.push({ id, name, color: state.modalDraft.color });
              state.view = { type: 'project', id };
              state.modal = null;
              render();
            }
          }
        });
      }
    }

    function confirmAdd() {
      const v = state.addInput.trim();
      if (!v) { cancelAdd(); return; }
      const v_ = state.view;
      const newTask = {
        id: state.nextId++,
        title: v,
        desc: '',
        done: false,
        projectId: v_.type === 'project' ? v_.id : 'p1',
        priority: 4,
        due: v_.type === 'smart' && v_.id === 'today' ? todayISO : null,
        tagIds: v_.type === 'tag' ? [v_.id] : [],
        subtasks: [],
      };
      state.tasks.push(newTask);
      state.addInput = '';
      // keep adding
      render();
    }

    function cancelAdd() {
      state.addingInGroup = null;
      state.addInput = '';
      render();
    }

    // ── Init ──
    render();
  </script>
</body>
</html>
