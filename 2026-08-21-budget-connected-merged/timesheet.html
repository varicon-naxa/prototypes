<!-- ════ TOP-LEVEL PAGE: Timesheet ════
     Reached from the sidebar, not the project tab bar: it spans projects and
     filters down to one, which is why it carries a Project picker and no
     project name in its title. -->
<div class="ts-page">

  <div class="ts-tabbar">
    <div class="ts-tabs">
      <span class="ts-tab active" onclick="tsSetTab(this,'timesheet')">TIMESHEET <span id="tsTabCount">(0)</span></span>
      <span class="ts-tab" onclick="tsSetTab(this,'workers')">WORKERS <span id="tsWorkerCount">(0)</span></span>
    </div>
    <div class="ts-tabbar-right">
      <span class="ts-help"><i class="far fa-circle-question"></i> Need Help? <i class="fas fa-caret-down"></i></span>
      <button class="btn btn-outline btn-sm"><i class="fas fa-download"></i> EXPORT</button>
      <button class="btn btn-primary btn-sm" onclick="tsOpenAdd()"><i class="fas fa-circle-plus"></i> Add Timesheet</button>
      <span class="ts-kebab"><i class="fas fa-ellipsis-vertical"></i></span>
    </div>
  </div>

  <div class="ts-filters">
    <div class="ts-select" id="tsProjectPick">
      <span id="tsProjectLabel">Project</span><i class="fas fa-chevron-down"></i>
    </div>
    <div class="ts-weeknav">
      <span class="ts-week-arrow" onclick="tsStepWeek(-1)"><i class="fas fa-chevron-left"></i></span>
      <span class="ts-week"><i class="far fa-calendar"></i> <span id="tsWeekLabel"></span></span>
      <span class="ts-week-arrow" onclick="tsStepWeek(1)"><i class="fas fa-chevron-right"></i></span>
    </div>
    <div class="ts-select ts-filter-btn"><i class="fas fa-filter"></i> Filters</div>
    <div class="ts-search"><i class="fas fa-magnifying-glass"></i>
      <input id="tsSearch" placeholder="Search Entries" oninput="tsRender()">
    </div>
  </div>

  <div class="ts-tiles">
    <div class="ts-tile-group">
      <div class="ts-tile"><i class="far fa-clipboard"></i>
        <div><b id="tsTotal">0</b><span>Total timesheet</span></div></div>
      <div class="ts-tile"><i class="far fa-square-check"></i>
        <div><b id="tsApproved">0</b><span>Approved</span></div></div>
      <div class="ts-tile"><i class="fas fa-lock"></i>
        <div><b id="tsLocked">0</b><span>Payroll Locked</span></div></div>
      <div class="ts-tile"><i class="far fa-circle-question"></i>
        <div><b id="tsUnapproved">0</b><span>Unapproved</span></div></div>
      <div class="ts-tile"><div><b id="tsRejected">0</b><span>Rejected</span></div></div>
      <div class="ts-tile"><div><b id="tsResubmitted">0</b><span>Resubmitted</span></div></div>
    </div>
    <div class="ts-tile-group">
      <div class="ts-tile"><i class="fas fa-users"></i>
        <div><b id="tsWorkers">0</b><span>Workers</span></div></div>
      <div class="ts-tile"><i class="far fa-square-check"></i>
        <div><b id="tsApprovedHrs">0H 0M</b><span>Approved Hrs</span></div></div>
    </div>
  </div>
  <div class="ts-tiles">
    <div class="ts-tile-group">
      <div class="ts-tile"><div><b id="tsRejectedTime">0H 0M</b><span>Rejected Time</span></div></div>
      <div class="ts-tile"><div><b id="tsResubTime">0H 0M</b><span>Resubmitted Time</span></div></div>
    </div>
  </div>

  <div class="ts-table-wrap">
    <table class="ts-table">
      <thead>
        <tr>
          <th class="ts-check"><input type="checkbox"></th>
          <th>Worker</th>
          <th>Project</th>
          <th>Approver</th>
          <th>Submitted time</th>
          <th>Approved time</th>
          <th>Task/Cost Centre</th>
          <th>Status</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tsBody"></tbody>
    </table>
  </div>

  <div class="ts-pager">
    <div class="ts-rows">Rows per page
      <select id="tsRows" onchange="tsRender()">
        <option>15</option><option>30</option><option>50</option>
      </select>
    </div>
    <div class="ts-pages" id="tsPages"></div>
    <div class="ts-count" id="tsCount"></div>
  </div>
</div>
