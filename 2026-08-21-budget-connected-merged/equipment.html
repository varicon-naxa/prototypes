<!-- ════ TOP-LEVEL PAGE: Equipment Registry ════
     Org-level, off the sidebar. Every machine here is one the budget already
     charges to the job — the base's plant fleet — so the register is the fleet
     rather than a separate list that could disagree with it. -->
<div class="eq-page">

  <div class="eq-head">
    <h2>Equipment Registry</h2>
    <div class="eq-head-right">
      <span class="eq-help"><i class="far fa-circle-question"></i> Need Help?</span>
      <button class="btn btn-primary btn-sm" onclick="eqOpenAdd()">
        Add Equipment <i class="fas fa-caret-down" style="margin-left:6px"></i></button>
      <span class="eq-kebab"><i class="fas fa-ellipsis-vertical"></i></span>
    </div>
  </div>

  <div class="eq-filters">
    <div class="eq-select" id="eqFilterType" onclick="eqCycle('type')">
      <span>Type</span><i class="fas fa-chevron-down"></i></div>
    <div class="eq-select" id="eqFilterStatus" onclick="eqCycle('status')">
      <span>Status</span><i class="fas fa-chevron-down"></i></div>
    <div class="eq-select"><span>Company/Suppliers</span><i class="fas fa-chevron-down"></i></div>
    <div class="eq-select"><span>Plant Manager</span><i class="fas fa-chevron-down"></i></div>
    <div class="eq-views">
      <span class="eq-view"><i class="fas fa-table-columns"></i></span>
      <span class="eq-view on"><i class="fas fa-bars"></i></span>
    </div>
    <div class="eq-search">
      <input id="eqSearch" placeholder="Search Equipment" oninput="eqRender()">
      <i class="fas fa-magnifying-glass"></i>
    </div>
  </div>

  <div class="eq-tabs" id="eqTabs"></div>

  <div class="eq-table-wrap">
    <table class="eq-table">
      <thead>
        <tr>
          <th class="eq-check"><input type="checkbox" onclick="eqToggleAll(this)"></th>
          <th>Image</th>
          <th class="eq-sortable" onclick="eqSort('name')">Equipment Name <i class="fas fa-sort"></i></th>
          <th class="eq-sortable" onclick="eqSort('id')">Equipment ID <i class="fas fa-sort"></i></th>
          <th>Type</th>
          <th>Company/Supplier</th>
          <th>Status</th>
          <th>Meter Readings</th>
          <th>Next Servicing</th>
          <th>Plant Manager</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="eqBody"></tbody>
    </table>
  </div>

  <div class="eq-pager">
    <div class="eq-rows">Rows per page
      <select id="eqRows" onchange="eqRender()">
        <option>50</option><option>15</option><option>30</option>
      </select>
    </div>
    <div class="eq-count" id="eqCount"></div>
    <div class="eq-pages" id="eqPages"></div>
  </div>
</div>
