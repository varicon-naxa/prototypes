<!-- ════ TOP-LEVEL PAGE: Suppliers ════
     Org-level, off the sidebar: suppliers are shared across jobs, which is why
     this carries no project context.

     Every supplier here is one the budget actually names — on a purchase
     order, a site docket, a bill or a cost-plus invoice. Nothing invented. -->
<div class="sp-page">

  <div class="sp-toolbar">
    <span class="sp-view" title="List view"><i class="fas fa-bars"></i></span>
    <div class="sp-search">
      <input id="spSearch" placeholder="Search" oninput="spRender()">
      <i class="fas fa-magnifying-glass"></i>
    </div>
    <!-- Xero is the accounting substrate; suppliers sync in from it. Bills and
         POs are raised in Varicon, so a supplier can also be created here. -->
    <button class="btn btn-outline btn-sm sp-sync" id="spSync" onclick="spSync()">
      <span class="sp-xero">xero</span> Sync Suppliers</button>
    <button class="btn btn-primary btn-sm" onclick="spAdd()">
      <i class="fas fa-plus"></i> Add Supplier</button>
    <span class="sp-kebab"><i class="fas fa-ellipsis-vertical"></i></span>
  </div>

  <div class="sp-table-wrap">
    <table class="sp-table">
      <thead>
        <tr>
          <th class="sp-check"><input type="checkbox" onclick="spToggleAll(this)"></th>
          <th class="sp-sortable" onclick="spSort('name')">Supplier Name <i class="fas fa-sort"></i></th>
          <th class="sp-sortable" onclick="spSort('abn')">ABN <i class="fas fa-sort"></i></th>
          <th class="sp-sortable" onclick="spSort('address')">Address <i class="fas fa-sort"></i></th>
          <th>Email</th>
          <th>Phone</th>
          <th>Lead Contact Person</th>
          <th class="sp-sortable" onclick="spSort('updated')">Last Updated <i class="fas fa-sort"></i></th>
          <th>Source</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="spBody"></tbody>
    </table>
  </div>

  <div class="sp-pager">
    <div class="sp-rows">Rows per page
      <select id="spRows" onchange="spRender()">
        <option>15</option><option>30</option><option>50</option>
      </select>
    </div>
    <div class="sp-count" id="spCount"></div>
    <div class="sp-pages" id="spPages"></div>
  </div>
</div>
