<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SWMS Form Revision — Varicon</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#f0f2f5;color:#333;display:flex;height:100vh;overflow:hidden}

/* Sidebar */
.sidebar{width:240px;background:#1b2a4a;color:#fff;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;overflow-y:auto}
.sidebar-header{display:flex;align-items:center;gap:10px;padding:16px 16px 12px;border-bottom:1px solid rgba(255,255,255,.08)}
.logo-icon{width:32px;height:32px;background:linear-gradient(135deg,#f5a623,#f7c948);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:#1b2a4a}
.logo-text{font-size:16px;font-weight:700;color:#fff}
.logo-sub{font-size:10px;color:rgba(255,255,255,.45);display:block}
.sidebar-nav{padding:8px 0;flex:1}
.nav-section-label{font-size:11px;font-weight:600;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.5px;padding:16px 16px 6px}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 16px;font-size:14px;color:rgba(255,255,255,.75);cursor:pointer;transition:all .15s;text-decoration:none}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:#f5a623;color:#fff;font-weight:600;border-radius:0 6px 6px 0;margin-right:8px}
.nav-item i{width:20px;text-align:center;font-size:15px}
.sidebar-footer{padding:12px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:rgba(255,255,255,.4)}

/* Main */
.main{margin-left:240px;flex:1;display:flex;flex-direction:column;height:100vh;overflow-y:auto}
.topbar{background:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:50}
.topbar-left h1{font-size:18px;font-weight:700;color:#1b2a4a}
.topbar-left .sub{font-size:12px;color:#64748b;margin-top:1px}
.topbar-right{display:flex;align-items:center;gap:10px}
.topbar-btn{padding:8px 14px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid #e2e8f0;background:#fff;color:#1b2a4a;font-family:'Inter',sans-serif;display:flex;align-items:center;gap:6px}
.topbar-btn:hover{background:#f8fafc}
.topbar-btn.reset{border-color:#fed7aa;color:#b45309}
.topbar-btn.reset:hover{background:#fff7ed}
.topbar-btn.info-icon{border-color:#bfdbfe;color:#1e40af}
.topbar-btn.info-icon i{color:#2563eb}
.topbar-btn.info-icon:hover{background:#eff6ff}
.user-avatar{width:34px;height:34px;background:#1b2a4a;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}

.content{padding:18px 24px 60px;max-width:1180px;width:100%}

/* Tabs */
.tab-row{display:flex;gap:6px;border-bottom:1px solid #e2e8f0;margin-bottom:14px}
.primary-tab{display:flex;align-items:center;gap:8px;padding:12px 16px;font-size:14px;font-weight:600;color:#64748b;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.primary-tab.active{color:#1b2a4a;border-bottom-color:#f5a623}

/* Breadcrumbs */
.breadcrumbs{display:flex;align-items:center;gap:6px;padding:4px 0 14px;font-size:13px;color:#64748b;flex-wrap:wrap}
.breadcrumbs .crumb{cursor:pointer;padding:3px 6px;border-radius:4px}
.breadcrumbs .crumb:hover{background:#f1f5f9;color:#1b2a4a}
.breadcrumbs .crumb.current{color:#1b2a4a;font-weight:600;cursor:default}
.breadcrumbs .sep{opacity:.5;font-size:10px}

/* Project context bar */
.context-bar{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.context-bar .cb-name{font-size:16px;font-weight:700;color:#1b2a4a}
.context-bar .cb-meta{font-size:13px;color:#64748b;display:flex;align-items:center;gap:6px}
.status-chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:12px;background:#dcfce7;color:#166534}
.status-chip .dot{width:7px;height:7px;border-radius:50%;background:#16a34a}

/* Lifecycle rail */
.lifecycle{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:16px 18px;margin-bottom:16px}
.lifecycle-title{font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.lifecycle-title i{color:#f5a623}
.stages{display:flex;align-items:flex-start;gap:0}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;cursor:default}
.stage:not(:last-child)::after{content:'';position:absolute;top:16px;left:calc(50% + 18px);right:calc(-50% + 18px);height:2px;background:#e2e8f0;z-index:0}
.stage.done:not(:last-child)::after{background:#16a34a}
.stage .st-circle{width:34px;height:34px;border-radius:50%;background:#f1f5f9;color:#94a3b8;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;z-index:1;border:2px solid #f1f5f9;transition:all .2s}
.stage.done .st-circle{background:#16a34a;color:#fff;border-color:#16a34a}
.stage.active .st-circle{background:#f5a623;color:#fff;border-color:#fde68a;box-shadow:0 0 0 4px #fff7ed}
.stage .st-label{font-size:11px;font-weight:600;color:#94a3b8;margin-top:7px;max-width:96px;line-height:1.3}
.stage.done .st-label,.stage.active .st-label{color:#1b2a4a}

/* Layout: hub + guidance */
.grid{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start}
@media(max-width:1080px){.grid{grid-template-columns:1fr}}

/* Revision form header */
.rev-form-header{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:18px 20px;margin-bottom:14px;display:flex;flex-direction:column;gap:12px}
.rfh-top{display:flex;align-items:center;gap:16px}
.rfh-bottom{display:flex;align-items:center;gap:16px;justify-content:space-between;border-top:1px solid #f1f5f9;padding-top:12px;flex-wrap:wrap}
.rfh-icon{width:46px;height:46px;border-radius:10px;background:#fee2e2;color:#dc2626;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.rfh-info{flex:1;min-width:0}
.rfh-title{font-size:16px;font-weight:700;color:#1b2a4a;display:flex;align-items:center;gap:8px}
.rfh-sub{font-size:12px;color:#64748b;margin-top:2px}
.rfh-stats{display:flex;gap:16px;font-size:12px;color:#64748b}
.rfh-stats b{color:#1b2a4a;font-weight:700;display:block;font-size:15px}
.tag.swms{background:#ddd6fe;color:#5b21b6;font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.4px}
.compare-toggle-btn{padding:9px 14px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid #e2e8f0;background:#fff;color:#1b2a4a;font-family:'Inter',sans-serif;display:inline-flex;align-items:center;gap:8px}
.compare-toggle-btn:hover{border-color:#f5a623;color:#f5a623;background:#fff7ed}

/* Revision list */
.rev-list{background:#fff;border:1px solid #e2e8f0;border-radius:8px;overflow:hidden}
.rev-row{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid #f1f5f9;flex-wrap:wrap}
.rev-row:last-child{border-bottom:none}
.rev-row.current{background:#fff7ed}
.num-circle{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#f1f5f9;color:#1b2a4a;font-size:13px;font-weight:700;flex-shrink:0}
.rev-row.current .num-circle{background:#f5a623;color:#fff}
.rev-row.locked-rev .num-circle{background:#dcfce7;color:#166534}
.rev-row.superseded .num-circle{background:#f1f5f9;color:#94a3b8}
.rev-info{flex:1 1 220px;min-width:200px}
.rev-summary{font-size:14px;font-weight:600;color:#1b2a4a;margin-bottom:3px}
.rev-row.superseded .rev-summary{color:#94a3b8;text-decoration:line-through;text-decoration-color:#cbd5e1}
.rev-meta{font-size:12px;color:#64748b;display:flex;gap:14px;flex-wrap:wrap}
.rev-meta i{margin-right:4px;opacity:.7}
.rev-status{font-size:11px;font-weight:600;padding:4px 10px;border-radius:12px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.rev-status.locked{background:#dcfce7;color:#166534}
.rev-status.active{background:#dcfce7;color:#166534;box-shadow:0 0 0 1px #bbf7d0}
.rev-status.draft{background:#fef3c7;color:#92400e}
.rev-status.under_review{background:#dbeafe;color:#1e40af}
.rev-status.approved{background:#e0e7ff;color:#3730a3}
.rev-status.superseded{background:#f1f5f9;color:#94a3b8}
.rev-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;min-width:210px}
.rev-btn{padding:7px 13px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid #e2e8f0;background:#fff;color:#1b2a4a;font-family:'Inter',sans-serif;display:flex;align-items:center;gap:6px}
.rev-btn:hover{background:#f8fafc}
.rev-btn.primary{background:#16a34a;color:#fff;border-color:#16a34a}
.rev-btn.primary:hover{background:#15803d}
.rev-btn.amber{background:#f5a623;color:#fff;border-color:#f5a623}
.rev-btn.amber:hover{background:#e0940f}
.rev-btn.blue{background:#2563eb;color:#fff;border-color:#2563eb}
.rev-btn.ghost{color:#64748b}
.new-rev-btn{padding:12px 16px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;border:1px dashed #cbd5e1;background:#fafbfd;color:#1b2a4a;font-family:'Inter',sans-serif;display:flex;align-items:center;gap:8px;margin-top:14px;width:100%;justify-content:center}
.new-rev-btn:hover{border-color:#f5a623;color:#f5a623;background:#fff7ed}
.new-rev-btn:disabled{opacity:.5;cursor:not-allowed}

/* Active banner */
.active-banner{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;gap:10px;font-size:13px;color:#166534}
.active-banner i{font-size:15px}
.active-banner b{font-weight:700}
.active-banner .ab-right{margin-left:auto;font-size:12px;color:#15803d}

/* Guidance panel */
.guide{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:16px 18px;position:sticky;top:78px}
.guide h3{font-size:13px;font-weight:700;color:#1b2a4a;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.guide h3 i{color:#f5a623}
.guide .g-step{font-size:12px;color:#475569;padding:10px 0;border-bottom:1px dashed #eef1f5;line-height:1.5}
.guide .g-step:last-child{border-bottom:none}
.guide .g-step b{color:#1b2a4a}
.guide .g-note{font-size:11px;color:#64748b;background:#f8fafc;border:1px solid #eef1f5;border-radius:6px;padding:10px;margin-top:12px;line-height:1.5}
.guide .g-legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.g-legend .status-chip{font-size:10px;padding:2px 8px}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(2px);padding:20px}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:12px;width:100%;max-width:560px;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(15,23,42,.25);animation:mIn .2s ease}
.modal.wide{max-width:680px}
.modal.info{max-width:860px}
@keyframes mIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.m-head{padding:18px 22px 14px;border-bottom:1px solid #e2e8f0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.m-title{font-size:17px;font-weight:700;color:#1b2a4a}
.m-sub{font-size:12px;color:#64748b;margin-top:3px;line-height:1.5}
.m-close{background:none;border:none;color:#64748b;font-size:17px;cursor:pointer;padding:6px 9px;border-radius:6px}
.m-close:hover{background:#f1f5f9;color:#1b2a4a}
.m-body{padding:20px 22px;overflow-y:auto}
.m-foot{padding:14px 22px;border-top:1px solid #e2e8f0;display:flex;align-items:center;justify-content:flex-end;gap:10px;background:#fafbfd}
.btn{padding:10px 18px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;border:1px solid #e2e8f0;background:#fff;color:#1b2a4a;display:flex;align-items:center;gap:8px}
.btn:hover{background:#f1f5f9}
.btn.primary{background:#f5a623;color:#fff;border-color:#f5a623}
.btn.primary:hover{background:#e0940f}
.btn.green{background:#16a34a;color:#fff;border-color:#16a34a}
.btn.green:hover{background:#15803d}
.btn.danger{background:#fff;color:#dc2626;border-color:#fecaca}
.btn.danger:hover{background:#fef2f2}
.btn:disabled{opacity:.5;cursor:not-allowed}

.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;color:#1b2a4a;margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;padding:10px 12px;border-radius:6px;border:1px solid #e2e8f0;font-size:13px;font-family:'Inter',sans-serif;color:#1b2a4a}
.field textarea{min-height:70px;resize:vertical}
.field input:focus,.field textarea:focus{outline:none;border-color:#f5a623}

/* type toggle */
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.type-card{border:2px solid #e2e8f0;border-radius:10px;padding:16px;cursor:pointer;transition:all .15s}
.type-card:hover{border-color:#f5a623}
.type-card.sel{border-color:#f5a623;background:#fff7ed}
.type-card .tc-ico{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:10px}
.type-card.swms .tc-ico{background:#ddd6fe;color:#5b21b6}
.type-card.general .tc-ico{background:#e0f2fe;color:#0369a1}
.type-card .tc-n{font-size:14px;font-weight:700;color:#1b2a4a}
.type-card .tc-d{font-size:11px;color:#64748b;margin-top:3px;line-height:1.45}

/* elements list (builder mock) */
.el-list{border:1px solid #e2e8f0;border-radius:8px;overflow:hidden;margin-bottom:8px}
.el-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #f1f5f9;font-size:13px;color:#1b2a4a}
.el-item:last-child{border-bottom:none}
.el-item i{color:#94a3b8;width:18px;text-align:center}
.el-item .el-new{margin-left:auto;font-size:10px;font-weight:700;color:#166534;background:#dcfce7;padding:2px 7px;border-radius:8px}
.consult-box{background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:12px 14px;font-size:12px;color:#1e40af;display:flex;gap:10px;margin-top:12px}
.consult-box i{margin-top:2px}

/* signature pad */
.sig-pad{border:2px dashed #cbd5e1;border-radius:8px;height:110px;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:13px;background:#fafbfd;cursor:crosshair;position:relative;overflow:hidden}
.sig-pad.signed{border-style:solid;border-color:#16a34a;background:#f0fdf4;color:#166534}
.sig-pad .sig-name{font-family:'Brush Script MT',cursive;font-size:30px;color:#1b2a4a}
.signee-list{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.signee-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid #e2e8f0;border-radius:8px}
.sg-avatar{width:30px;height:30px;border-radius:50%;background:#1b2a4a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
.sg-name{font-size:13px;font-weight:600;color:#1b2a4a}
.sg-role{font-size:11px;color:#64748b}
.sg-time{margin-left:auto;font-size:11px;color:#166534;font-weight:600}
.warn-box{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:12px 14px;font-size:12px;color:#92400e;display:flex;gap:10px;line-height:1.5}
.warn-box i{margin-top:2px}
.info-line{font-size:12px;color:#64748b;margin-top:10px;display:flex;gap:8px;align-items:center}
.info-line .ver{font-family:monospace;background:#f1f5f9;padding:2px 7px;border-radius:5px;color:#1b2a4a;font-size:11px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1b2a4a;color:#fff;padding:12px 20px;border-radius:8px;font-size:13px;font-weight:500;z-index:400;box-shadow:0 10px 30px rgba(0,0,0,.2);display:flex;align-items:center;gap:10px;opacity:0;transition:opacity .2s,transform .2s}
.toast.show{opacity:1}
.toast i{color:#4ade80}
.topbar-btn.portal{border-color:#c7d2fe;color:#4338ca}
.topbar-btn.portal i{color:#6366f1}
.topbar-btn.portal:hover{background:#eef2ff}

/* Rev number tag on a revision row */
.rev-tag{display:inline-block;font-size:10px;font-weight:700;color:#5b21b6;background:#ede9fe;padding:1px 7px;border-radius:6px;text-transform:uppercase;letter-spacing:.4px;margin-right:6px;vertical-align:middle}

/* SWMS subcategory forms list */
.list-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.list-title{font-size:16px;font-weight:700;color:#1b2a4a}
.list-sub{font-size:12px;color:#64748b;margin-top:2px}
.form-list{background:#fff;border:1px solid #e2e8f0;border-radius:8px;overflow:hidden}
.form-row{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid #f1f5f9;cursor:pointer;transition:background .1s}
.form-row:last-child{border-bottom:none}
.form-row:hover{background:#fafbfd}
.form-row-title{font-size:14px;font-weight:700;color:#1b2a4a}
.form-row-sub{font-size:12px;color:#64748b;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.type-locked{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:#475569;background:#f8fafc;border:1px solid #eef1f5;border-radius:8px;padding:10px 12px;line-height:1.5}
.tag.general{background:#dbeafe;color:#1e40af;font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.4px}

/* Form settings page (mirrors the builder Settings tab) */
.set-section{background:#fff;border:1px solid #e2e8f0;border-radius:10px;margin-bottom:16px;overflow:hidden}
.set-head{padding:15px 20px;border-bottom:1px solid #f1f5f9}
.set-title{font-size:15px;font-weight:700;color:#111827}
.set-sub{font-size:12px;color:#637188;margin-top:3px}
.set-body{padding:18px 20px}
.tc-radio{margin-left:auto;color:#f5a623;font-size:15px}
.type-card .tc-n{display:flex;align-items:center;gap:8px}
.assign-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:820px){.assign-grid{grid-template-columns:1fr}}
.a-card{border:1px solid #eeeeee;border-radius:10px;overflow:hidden}
.a-head{padding:12px 14px;display:flex;align-items:flex-start;gap:10px}
.a-ico{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px}
.a-txt{flex:1;min-width:0}
.a-title{font-size:13px;font-weight:700;color:#111827;display:flex;align-items:center;gap:8px}
.a-sum{font-size:11px;color:#637188;margin-top:2px}
.badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap}
.badge.req{background:#fff7ed;color:#ea580c}
.badge.opt{background:#f5f5f5;color:#637188}
.a-exp{padding:10px 14px 14px;background:#fafafa;border-top:1px solid #f1f5f9}
.seg{display:inline-flex;border:1px solid #eeeeee;border-radius:6px;overflow:hidden;background:#fff}
.seg span{padding:6px 16px;font-size:12px;color:#637188;cursor:pointer;border-right:1px solid #eeeeee;user-select:none}
.seg span:last-child{border-right:none}
.seg span.on{background:#fff7ed;color:#f5a623;font-weight:600}
.sub-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.sub-label{font-size:13px;color:#111827;font-weight:600}
.sub-desc{font-size:11px;color:#637188;margin-top:2px}
.set-select{padding:8px 12px;border:1px solid #e2e8f0;border-radius:6px;font-size:13px;font-family:'Inter',sans-serif;color:#1b2a4a;background:#fff}
.set-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:4px}
/* iOS-style switch */
.sw{position:relative;width:38px;height:22px;border-radius:11px;background:#cbd5e1;cursor:pointer;transition:background .15s;flex-shrink:0}
.sw.on{background:#f5a623}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on::after{left:18px}

/* Free-entry multi-email input (daywork-docket style) */
.email-input-row{display:flex;gap:8px}
.email-input-row input{flex:1}
.email-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.email-chip{display:inline-flex;align-items:center;gap:6px;background:#eef2ff;color:#3730a3;border:1px solid #c7d2fe;border-radius:14px;padding:5px 6px 5px 12px;font-size:12px;font-weight:600}
.email-chip button{background:none;border:none;color:#6366f1;cursor:pointer;font-size:12px;line-height:1;padding:2px 5px;border-radius:50%}
.email-chip button:hover{background:#c7d2fe;color:#312e81}

/* Read-only form */
.ro-banner{background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:10px 14px;font-size:12px;color:#1e40af;display:flex;gap:8px;align-items:center;margin-bottom:14px}
.ro-form{display:flex;flex-direction:column;gap:12px}
.ro-field label{display:block;font-size:12px;font-weight:600;color:#64748b;margin-bottom:4px}
.ro-val{font-size:13px;color:#1b2a4a;background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;padding:9px 12px}

/* Review status */
.rs-block{border:1px solid #e2e8f0;border-radius:8px;padding:14px;margin-bottom:12px}
.rs-head{font-size:14px;font-weight:700;color:#1b2a4a;display:flex;align-items:center;gap:10px;margin-bottom:2px}
.rs-sub{font-size:12px;color:#64748b;margin-bottom:10px}
.rs-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed #eef1f5}
.rs-row .status-chip{white-space:nowrap}

/* External client portal (logged-out page) */
.ext-overlay{position:fixed;inset:0;background:#eef2f7;z-index:300;display:none;flex-direction:column}
.ext-overlay.open{display:flex}
.ext-top{background:#1b2a4a;color:#fff;padding:14px 22px;display:flex;align-items:center;justify-content:space-between}
.ext-brand{display:flex;align-items:center;gap:10px;font-size:14px}
.ext-top .m-close{color:rgba(255,255,255,.8)}
.ext-top .m-close:hover{background:rgba(255,255,255,.12);color:#fff}
.ext-scroll{flex:1;overflow-y:auto;padding:26px 16px}
.ext-card{max-width:620px;margin:0 auto;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:22px 24px;box-shadow:0 10px 30px rgba(15,23,42,.06)}
.ext-note{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:10px 14px;font-size:12px;color:#166534;display:flex;gap:8px;align-items:center;margin-bottom:16px}
.ext-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}
.ext-empty{max-width:420px;margin:60px auto;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:40px 24px;text-align:center;font-size:14px;color:#475569}
</style>
</head>
<body>

<!-- Sidebar -->

  <div class="sidebar-header">

      <span class="cb-name">Northside Tunnel Upgrade</span>
      <span class="status-chip"><span class="dot"></span> Active</span>
      <span class="cb-meta"><i class="fa-regular fa-calendar"></i> Started 12 Aug 2025</span>

<!-- Modal root -->
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<!-- External (logged-out) client review page -->
<div class="ext-overlay" id="extOverlay"></div>
<div class="toast" id="toast"></div>

<script>
/* ---------------- state model ---------------- */
const STATUS = {
  draft:        {label:'Draft',        cls:'draft'},
  under_review: {label:'Under review', cls:'under_review'},
  approved:     {label:'Approved',     cls:'approved'},
  locked:       {label:'Locked', cls:'locked'},
  superseded:   {label:'Superseded',   cls:'superseded'},
};
const STAGES = ['Create','Build & consult','Review & sign','Lock','Worker sign-on','Submit / work','Revise'];

// Read-only form content shown when viewing any revision.
const FORM_ELEMENTS = [
  {q:'Task step', a:'Excavate trench to 1.8 m depth along gridline B'},
  {q:'Hazard', a:'Cave-in / ground collapse'},
  {q:'Risk rating', a:'High'},
  {q:'Control measures', a:'Trench shoring / benching · exclusion zone · spotter present'},
  {q:'Adjacent services', a:'Locate & pothole before excavation'},
  {q:'PPE required', a:'Hard hat · hi-vis · steel caps · gloves'},
  {q:'Supervisor sign-off', a:'Required before entry'},
];
const sig = (name,status,date)=>({name,status,date,comment:''});
function mk(n){const names=[['JD','John Doe','Excavator Op.'],['AM','Aisha Malik','Labourer'],['TN','Tom Nguyen','Supervisor'],['RP','Rita Poudel','Spotter'],['KB','Kev Brown','Plant Op.'],['Ls','Liu Shan','Labourer']];return Array.from({length:n},(_,i)=>names[i%names.length]);}

// SWMS forms in the "SWMS" subcategory of this project. Each has its own revisions.
const SEED_FORMS = () => ([
  { id:1, type:'SWMS', title:'SWMS — Excavating and Working in Trenches', hrcw:'Trenches deeper than 1.5 m', revs:[
    {rev:1,status:'locked',date:'12/01/2026',by:'Sarah Chen',summary:'Initial draft based on standard SWMS template',signees:mk(6),consulted:true,active:false,reviewers:[sig('safety@northsidejv.com.au','signed','11/01/2026')]},
    {rev:2,status:'locked',date:'02/02/2026',by:'Mike Jones',summary:'Updated PPE requirements after toolbox talk',signees:mk(14),consulted:true,active:false,reviewers:[sig('safety@northsidejv.com.au','signed','01/02/2026'),sig('pc@buildco.com.au','signed','02/02/2026')]},
    {rev:3,status:'locked',date:'17/02/2026',by:'Sarah Chen',summary:'Added trench shoring sign-off step',signees:mk(8),consulted:true,active:true,reviewers:[sig('safety@northsidejv.com.au','signed','16/02/2026'),sig('pc@buildco.com.au','signed','17/02/2026')]},
  ]},
  { id:2, type:'SWMS', title:'SWMS — Working at Heights', hrcw:'Work where a person could fall > 2 m', revs:[
    {rev:1,status:'locked',date:'18/06/2025',by:'Mike Jones',summary:'Initial Working at Heights SWMS',signees:mk(9),consulted:true,active:true,reviewers:[sig('safety@northsidejv.com.au','signed','17/06/2025')]},
  ]},
]);
let FORMS = SEED_FORMS();
let curId = 1;          // currently opened form
let view = 'list';      // 'projects' | 'pcats' | 'psubs' | 'list' | 'hub' | 'settings'
let nextFormId = 3;
function cf(){return FORMS.find(f=>f.id===curId);}

// --- Project Forms hierarchy (navigation-only drill-down for the breadcrumb) ---
const PROJECTS=[
  {id:'p1',name:'Northside Tunnel Upgrade',code:'NTU-2026'},
  {id:'p2',name:'Riverside Bridge Duplication',code:'RBD-2025'},
  {id:'p3',name:'Airport Rail Link',code:'ARL-2026'},
];
const CATS=[
  {id:'c1',name:'Health & Safety',color:'#ef4444',icon:'fa-shield-halved'},
  {id:'c2',name:'Quality',color:'#3b82f6',icon:'fa-clipboard-check'},
  {id:'c3',name:'Environment',color:'#22c55e',icon:'fa-leaf'},
];
// Subcategories per category — only Health & Safety › SWMS drills into the
// revision list; the rest are navigable placeholders (out of prototype scope).
const SUBS={
  c1:[
    {id:'s-swms',name:'SWMS',icon:'fa-helmet-safety',swms:true},
    {id:'s-insp',name:'Inspections',icon:'fa-magnifying-glass'},
    {id:'s-incident',name:'Incident Reports',icon:'fa-triangle-exclamation'},
  ],
  c2:[{id:'s-itp',name:'ITPs',icon:'fa-clipboard-list'},{id:'s-check',name:'Checklists',icon:'fa-list-check'}],
  c3:[{id:'s-env',name:'Environmental Controls',icon:'fa-leaf'}],
};
let curProject='p1';    // selected project
let curCategory='c1';   // selected category
function proj(){return PROJECTS.find(p=>p.id===curProject);}
function catObj(){return CATS.find(c=>c.id===curCategory);}

// Form-settings screen (matches the builder's Settings tab). Form Type is the headline setting.
const ASSIGN_DEFS = [
  {key:'projects', icon:'fa-folder-open', color:'#2563eb', bg:'#eff6ff', title:'Projects', req:true},
  {key:'users', icon:'fa-user', color:'#7c3aed', bg:'#f5f3ff', title:'Users', req:false},
  {key:'employees', icon:'fa-users', color:'#059669', bg:'#ecfdf5', title:'Employees', req:false},
  {key:'equipment', icon:'fa-truck', color:'#d97706', bg:'#fffbeb', title:'Equipment', req:false},
];
let settingsDraft = null;
function typeTag(t){return t==='GENERAL'
  ? '<span class="tag general">GENERAL</span>'
  : '<span class="tag swms">SWMS</span>';}

/* ---------------- render ---------------- */
function currentStage(){
  const cur = cf().revs.find(r=>['draft','under_review','approved'].includes(r.status));
  if(!cur) return 4; // locked & active — handed to workers (sign-on / fill happens on mobile/timesheet)
  if(cur.status==='draft') return 1;
  if(cur.status==='under_review') return 2;
  if(cur.status==='approved') return 3;
  return 0;
}
function stagesHTML(){
  const cs=currentStage();
  return STAGES.map((s,i)=>{
    const cls = i<cs?'done':(i===cs?'active':'');
    const inner = i<cs?'<i class="fa-solid fa-check"></i>':(i+1);
    return `<div class="stage ${cls}"><div class="st-circle">${inner}</div><div class="st-label">${s}</div></div>`;
  }).join('');
}
function legendHTML(){
  return Object.values(STATUS).map(s=>
    `<span class="status-chip ${s.cls}" style="background:${chipBg(s.cls)};color:${chipFg(s.cls)}">${s.label}</span>`).join('');
}
/* Informational modal: SWMS lifecycle rail + how it maps to AU SWMS */
function openInfoModal(){
  openModal(`
  <div class="m-head"><div><div class="m-title">SWMS revision — how it works</div>
    <div class="m-sub">Reference only. The stepper reflects where this form currently sits.</div></div>
    <button class="m-close" onclick="closeModal()">✕</button></div>
  <div class="m-body">
    <div class="lifecycle-title" style="margin-bottom:14px"><i class="fa-solid fa-timeline"></i> SWMS lifecycle</div>
    <div class="stages" style="margin-bottom:22px">${stagesHTML()}</div>
    <div style="border-top:1px solid #eef1f5;padding-top:16px">
      <div class="lifecycle-title" style="margin-bottom:12px"><i class="fa-solid fa-shield-halved"></i> How this maps to AU SWMS</div>
      <div class="g-step"><b>1. Classify</b> — form flagged <b>SWMS</b> in settings (else it stays a normal form, unchanged).</div>
      <div class="g-step"><b>2. Build &amp; consult</b> — draft prepared <i>with the workers</i> before work starts (WHS reg).</div>
      <div class="g-step"><b>3. Review &amp; sign</b> — sent to client/PC to comment, reject, or approve &amp; sign.</div>
      <div class="g-step"><b>4. Lock</b> — approved revision is frozen &amp; becomes the <b>Active</b> version.</div>
      <div class="g-step"><b>5. Worker sign-on</b> — workers acknowledge the active SWMS before working.</div>
      <div class="g-step"><b>6. Submit / work</b> — response pinned to the locked version; same at clock-in &amp; out.</div>
      <div class="g-step"><b>7. Revise</b> — change of work / new hazard forks a new draft; workers <b>re-sign</b>.</div>
      <div class="g-note"><i class="fa-solid fa-circle-info"></i> Locked revisions are immutable and retained for audit. Existing (non-SWMS) forms are untouched.</div>
      <div class="g-legend" style="margin-top:12px">${legendHTML()}</div>
    </div>
  </div>
  <div class="m-foot"><button class="btn" onclick="closeModal()">Close</button></div>`, false);
  document.getElementById('modal').classList.add('info');
}
function chipBg(c){return {active:'#dcfce7',locked:'#dcfce7',draft:'#fef3c7',under_review:'#dbeafe',approved:'#e0e7ff',superseded:'#f1f5f9'}[c];}
function chipFg(c){return {active:'#166534',locked:'#166534',draft:'#92400e',under_review:'#1e40af',approved:'#3730a3',superseded:'#94a3b8'}[c];}

function renderHub(){
  const total = cf().revs.length;
  const locked = cf().revs.filter(r=>r.status==='locked').length;
  const signees = cf().revs.reduce((a,r)=>a+r.signees.length,0);
  const active = cf().revs.find(r=>r.active);
  const hasOpenDraft = cf().revs.some(r=>['draft','under_review','approved'].includes(r.status));

  let html = `
  <div class="rev-form-header">
    <div class="rfh-top">
      <div class="rfh-icon"><i class="fa-solid fa-helmet-safety"></i></div>
      <div class="rfh-info">
        <div class="rfh-title">${cf().title} ${typeTag(cf().type)}</div>
        <div class="rfh-sub">Northside Tunnel Upgrade · Health &amp; Safety · SWMS &nbsp;·&nbsp; HRCW: ${cf().hrcw}</div>
      </div>
    </div>
    <div class="rfh-bottom">
      <div class="rfh-stats">
        <div><b>${total}</b> revisions</div>
        <div><b>${locked}</b> locked</div>
        <div><b>${signees}</b> total signees</div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="compare-toggle-btn" onclick="openSettings()"><i class="fa-solid fa-gear"></i> Form settings</button>
        <button class="compare-toggle-btn" onclick="openReviewStatus()"><i class="fa-solid fa-list-check"></i> Review status</button>
      </div>
    </div>
  </div>`;

  if(cf().type==='GENERAL'){
    html += `<div class="warn-box" style="background:#eff6ff;border-color:#bfdbfe;color:#1e40af"><i class="fa-solid fa-circle-info"></i><div>This is a <b>General</b> form — it uses the standard draft → publish flow. The SWMS revision &amp; client sign-off workflow below does not apply. Change the type in <b>Form settings</b>.</div></div><div style="height:14px"></div>`;
  }

  if(!active){
    html += `<div class="warn-box"><i class="fa-solid fa-triangle-exclamation"></i><div>No <b>Active</b> revision yet — this SWMS is not live until a revision is approved &amp; locked.</div></div><div style="height:14px"></div>`;
  }

  html += `<div class="rev-list">`;
  cf().revs.forEach(r=>{
    const rowCls = r.active?'current locked-rev':(r.status==='locked'?'locked-rev':(r.status==='superseded'?'superseded':(['draft','under_review','approved'].includes(r.status)?'current':'')));
    const st = STATUS[r.status];
    const statusLabel = r.active? 'Active (locked)' : st.label;
    const statusCls = r.active? 'active' : st.cls;
    html += `
    <div class="rev-row ${rowCls}">
      <div class="num-circle">${r.rev}</div>
      <div class="rev-info">
        <div class="rev-summary"><span class="rev-tag">Rev ${r.rev}</span> ${r.summary}</div>
        <div class="rev-meta">
          <span><i class="fa-regular fa-calendar"></i>${r.date}</span>
          <span><i class="fa-regular fa-user"></i>${r.by}</span>
          <span><i class="fa-solid fa-signature"></i>${r.signees.length} signees</span>
          ${r.consulted?'<span style="color:#16a34a"><i class="fa-solid fa-comments"></i>consulted</span>':''}
        </div>
      </div>
      <span class="rev-status ${statusCls}"><i class="fa-solid ${statusIcon(r)}"></i>${statusLabel}</span>
      <div class="rev-actions">${rowActions(r)}</div>
    </div>`;
  });
  html += `</div>`;

  html += `<button class="new-rev-btn" ${hasOpenDraft?'disabled title="Finish the open draft first"':''} onclick="newRevision()">
    <i class="fa-solid fa-plus"></i> ${hasOpenDraft?'Finish the open draft before starting a new revision':'New revision (work changed / new hazard / control revised)'}
  </button>`;

  document.getElementById('hub').innerHTML = html;
}
function statusIcon(r){
  if(r.active) return 'fa-circle-check';
  return {locked:'fa-lock',draft:'fa-pen',under_review:'fa-hourglass-half',approved:'fa-thumbs-up',superseded:'fa-clock-rotate-left'}[r.status];
}
function rowActions(r){
  const view = `<button class="rev-btn ghost" onclick="viewForm(${r.rev})"><i class="fa-solid fa-eye"></i> View</button>`;
  if(r.status==='draft')
    return `<button class="rev-btn" onclick="editDraft(${r.rev})"><i class="fa-solid fa-pen"></i> Edit</button>
            <button class="rev-btn blue" onclick="sendForReview(${r.rev})"><i class="fa-solid fa-paper-plane"></i> Send for review</button>`;
  if(r.status==='under_review')
    return `<button class="rev-btn" onclick="openReviewStatus()"><i class="fa-solid fa-list-check"></i> Review status</button>${view}`;
  if(r.status==='approved')
    return `<button class="rev-btn primary" onclick="confirmLock(${r.rev})"><i class="fa-solid fa-lock"></i> Confirm &amp; lock</button>${view}`;
  return view;
}

function statusChipHTML(r){
  const cls=r.active?'active':STATUS[r.status].cls;
  const label=r.active?'Active (locked)':STATUS[r.status].label;
  return `<span class="rev-status ${cls}"><i class="fa-solid ${statusIcon(r)}"></i>${label}</span>`;
}
/* ---------- subcategory forms list ---------- */
function renderList(){
  const rows=FORMS.map(f=>{
    const active=f.revs.find(r=>r.active);
    const open=f.revs.find(r=>['draft','under_review','approved'].includes(r.status));
    const chip=open?statusChipHTML(open):(active?statusChipHTML(active):`<span class="rev-status draft"><i class="fa-solid fa-pen"></i>Draft</span>`);
    return `<div class="form-row" onclick="openForm(${f.id})">
      <div class="rfh-icon" style="width:40px;height:40px;font-size:16px"><i class="fa-solid fa-helmet-safety"></i></div>
      <div style="flex:1;min-width:0">
        <div class="form-row-title">${f.title} <span class="tag swms">SWMS</span></div>
        <div class="form-row-sub">${f.revs.length} revision${f.revs.length>1?'s':''} · ${active?'Active: Rev '+active.rev:'no active version'} · HRCW: ${f.hrcw}</div>
      </div>
      ${chip}
      <i class="fa-solid fa-chevron-right" style="color:#cbd5e1"></i>
    </div>`;
  }).join('');
  document.getElementById('hub').innerHTML=`
    <div class="list-head">
      <div><div class="list-title">SWMS forms</div><div class="list-sub">${catObj().name} › SWMS · ${proj().name}</div></div>
      <button class="btn primary" onclick="openCreateForm()"><i class="fa-solid fa-plus"></i> Create SWMS form</button>
    </div>
    <div class="form-list">${rows}</div>`;
}

/* ---------- Project Forms drill-down (navigation only) ---------- */
function drillRow(onclick,iconBg,iconColor,icon,title,sub,tag){
  return `<div class="form-row" onclick="${onclick}">
    <div class="rfh-icon" style="width:40px;height:40px;font-size:15px;background:${iconBg};color:${iconColor}"><i class="fa-solid ${icon}"></i></div>
    <div style="flex:1;min-width:0">
      <div class="form-row-title">${title}${tag||''}</div>
      <div class="form-row-sub">${sub}</div>
    </div>
    <i class="fa-solid fa-chevron-right" style="color:#cbd5e1"></i>
  </div>`;
}
function renderProjects(){
  const rows=PROJECTS.map(p=>drillRow(
    `openProject('${p.id}')`,'#eef2ff','#4338ca','fa-folder-open',p.name,p.code)).join('');
  document.getElementById('hub').innerHTML=
    `<div class="list-head"><div><div class="list-title">All Projects</div><div class="list-sub">Select a project to view its forms</div></div></div>
     <div class="form-list">${rows}</div>`;
}
function renderProjectCategories(){
  const rows=CATS.map(c=>{
    const n=(SUBS[c.id]||[]).length;
    return drillRow(`openCategory('${c.id}')`,c.color+'22',c.color,c.icon,c.name,
      `${n} subcategor${n===1?'y':'ies'}`);
  }).join('');
  document.getElementById('hub').innerHTML=
    `<div class="list-head"><div><div class="list-title">${proj().name}</div><div class="list-sub">Form categories</div></div></div>
     <div class="form-list">${rows}</div>`;
}
function renderProjectSubcategories(){
  const rows=(SUBS[curCategory]||[]).map(s=>drillRow(
    `openSub('${s.id}',${!!s.swms})`,

let sendEmails=[];
function sendForReview(rev){
  sendEmails=[];
  openModal(`
  <div class="m-head"><div><div class="m-title">Send Rev ${rev} for review</div>
    <div class="m-sub">Add one or more client / principal-contractor emails to review and sign off before the SWMS goes live.</div></div>

        <input id="emailInput" type="email" placeholder="name@company.com.au" onkeydown="if(event.key==='Enter'){event.preventDefault();addEmail();}">

      </div>
      <div class="email-chips" id="emailChips"></div>
    </div>
    <div class="field"><label>Message (optional)</label><textarea>Please review the updated trench SWMS — added hazard rows for adjacent services.</textarea></div>
    <div class="info-line"><i class="fa-solid fa-circle-info"></i> Each email gets a secure link to verify without a Varicon login (daywork-docket style).</div>
  </div>
  <div class="m-foot">
    <button class="btn" onclick="closeModal()">Cancel</button>
    <button class="btn primary" onclick="doSend(${rev})"><i class="fa-solid fa-paper-plane"></i> Send for review</button>
  </div>`);
  renderEmailChips();document.getElementById('emailInput').focus();

function addEmail(){
  const inp=document.getElementById('emailInput');const v=(inp.value||'').trim();
  if(!v)return;
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){toast('Enter a valid email address.');return;}
  if(!sendEmails.includes(v))sendEmails.push(v);
  inp.value='';renderEmailChips();inp.focus();
}
function removeEmail(i){sendEmails.splice(i,1);renderEmailChips();}
function renderEmailChips(){
  const el=document.getElementById('emailChips');if(!el)return;
  el.innerHTML=sendEmails.map((e,i)=>`<span class="email-chip">${e}<button type="button" onclick="removeEmail(${i})">✕</button></span>`).join('');
}
function doSend(rev){
  addEmail(); // capture anything typed but not yet added
  if(!sendEmails.length){toast('Add at least one client email.');return;}
  const r=cf().revs.find(x=>x.rev===rev);
  r.reviewers=sendEmails.map(e=>({name:e,status:'pending',date:null,comment:''}));
  r.status='under_review';
  closeModal();renderAll();toast('Sent to '+sendEmails.length+' recipient'+(sendEmails.length>1?'s':'')+' for review.');
}

  const ext=document.getElementById('extOverlay');
  const opts=rev.reviewers.map((rv,i)=>`<option value="${i}">${rv.name} — ${rvLabel(rv.status)}</option>`).join('');

        <button class="btn green" onclick="portalAct('sign')"><i class="fa-solid fa-check"></i> Approve &amp; sign</button>
      </div>
    </div>`);
}
function portalAct(kind){
  const rev=cf().revs.find(r=>r.status==='under_review');if(!rev)return;
  const rv=rev.reviewers[portalWhoIdx];const cmt=(document.getElementById('cCmt')||{}).value||'';
  rv.comment=cmt;rv.date=today();
  if(kind==='reject'){rv.status='rejected';rev.status='draft';closeExt();renderAll();toast('Client rejected — revision returned to draft.');return;}
  rv.status='signed';
  if(rev.reviewers.every(x=>x.status==='signed'))rev.status='approved';
  closeExt();renderAll();toast('Signed as '+rv.name+(rev.status==='approved'?' — all clients signed, ready to lock.':'.'));

  const prev = cf().revs.find(r=>r.active);
  openModal(`
  <div class="m-head"><div><div class="m-title">Confirm &amp; lock Rev ${rev}</div>
    <div class="m-sub">This freezes the revision and makes it the active SWMS.</div></div>

  <div class="m-body">
    <div class="warn-box"><i class="fa-solid fa-triangle-exclamation"></i><div>

    </div></div>
    <div class="info-line" style="margin-top:14px"><i class="fa-solid fa-file-signature"></i> A PDF copy is shared with the Principal Contractor before work starts.</div>

  </div>`);
}
function doLock(rev){
  cf().revs.forEach(r=>{if(r.active){r.active=false;r.status='superseded';}});
  const r=cf().revs.find(x=>x.rev===rev);r.status='locked';r.active=true;r.date=today();
  closeModal();renderAll();toast('Rev '+rev+' locked and now Active. Workers must re-sign.');
}

    <div class="field"><label>Reason for revision</label>
      <select><option>Work / method changed</option><option>New hazard identified</option><option>Control measure revised</option><option>SWMS not being followed</option></select></div>
    <div class="field"><label>Summary of change</label><input id="nrSummary" value="New draft revision"></div>
    <div class="info-line"><i class="fa-solid fa-copy"></i> Cloned from active Rev ${active?active.rev:'—'}. The active version keeps working until this one is approved &amp; locked.</div>
  </div>
  <div class="m-foot">
    <button class="btn" onclick="closeModal()">Cancel</button>
    <button class="btn primary" onclick="doNewRev()"><i class="fa-solid fa-plus"></i> Create draft</button>
  </div>`);
}
function doNewRev(){
  const summary=document.getElementById('nrSummary').value||'New draft revision';
  const next=cf().revs.length+1;
  cf().revs.push({rev:next,status:'draft',date:today(),by:'Alec Neill',summary,signees:[],consulted:false,active:false,reviewers:[]});
  closeModal();renderAll();toast('Draft Rev '+next+' created. Build → consult → send for review.');
}

function resetDemo(){FORMS=SEED_FORMS();curId=1;view='list';nextFormId=3;curProject='p1';curCategory='c1';closeModal();closeExt();renderApp();toast('Demo reset.');}

renderAll();
</script>
</body>
</html>
